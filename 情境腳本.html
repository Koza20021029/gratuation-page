<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaka：島嶼的維度</title>

    <!-- 引入 Google Fonts (明體字型) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700;900&display=swap"
        rel="stylesheet">

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 載入漸變模糊效果組件 -->
    <script src="./gradual-blur.js?v=3"></script>

    <style>
        /* 自訂樣式與動畫 */
        body {
            font-family: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
            scroll-behavior: smooth;
        }

        .font-sans-custom {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 開場淡入動畫 */
        .fade-in-up {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s ease-out;
        }

        .fade-in-up.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 文字零碎重組動畫 CSS */
        .shatter-char {
            display: inline-block;
            opacity: 0;
            /* 使用 cubic-bezier 創造略帶彈性的吸附感 */
            transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.1),
                opacity 1.2s ease-in-out,
                filter 1.2s ease-out;
        }

        .shatter-char.assembled {
            opacity: 1;
            transform: translate(0, 0) rotate(0) scale(1) !important;
            filter: blur(0) !important;
        }

        /* 隱藏原生捲軸，讓嵌入畫面更乾淨 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #01120d;
        }

        ::-webkit-scrollbar-thumb {
            background: #064e3b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #047857;
        }
    </style>
</head>

<body id="main-body"
    class="min-h-screen bg-[#01120d] text-emerald-50 selection:bg-emerald-500/30 relative overflow-x-hidden">
    <!-- 頂部與底部漸變模糊毛玻璃效果 -->
    <gradual-blur preset="page-header" style="z-index: 30;"></gradual-blur>
    <gradual-blur preset="page-footer" style="z-index: 30;"></gradual-blur>

    <div class="relative z-10" id="app-container">
        <!-- 內容將由 JavaScript 動態生成 -->
    </div>

        function scrollToContent() {
            document.getElementById('script-content').scrollIntoView({ behavior: 'smooth' });

        // --- 文字碎裂重組動畫與標題區海洋過渡 ---
        function initShatterAnimation() {
            const titleEl = document.getElementById('main-title');
            if (!titleEl) return;

            const text = titleEl.textContent.trim();
            titleEl.innerHTML = '';

            const chars = text.split('');
            chars.forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.className = 'shatter-char';

                if (char === ' ' || char === '：') {
                    span.style.margin = '0 0.1em';
                }

                const translateX = (Math.random() - 0.5) * 600;
                const translateY = (Math.random() - 0.5) * 400;
                const rotateZ = (Math.random() - 0.5) * 180;
                const scale = Math.random() * 1.5 + 0.5;

                span.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${rotateZ}deg) scale(${scale})`;
                span.style.filter = 'blur(10px)';

                titleEl.appendChild(span);

                setTimeout(() => {
                    span.classList.add('assembled');
                }, 300 + (i * 100));
            });

            const totalAnimationTime = 300 + (chars.length * 100) + 1500;

            setTimeout(() => {
                const oceanOverlay = document.getElementById('ocean-overlay');
                if (oceanOverlay) {
                    oceanOverlay.classList.replace('opacity-0', 'opacity-100');
                }
            }, totalAnimationTime + 200);
        }

          <div class="absolute top-[-20%] left-1/2 -translate-x-1/2 w-[100vw] h-[60vh] bg-sky-500/10 rounded-full blur-[100px]"></div>

            </h2>
            <div class="h-px w-16 bg-emerald-500/50"></div>
          </div>
          
          <div class="flex flex-col md:flex-row items-center justify-center mb-10 gap-4 md:gap-6">
            <!-- 主標題保持極大字體 -->
            <h1 id="main-title" class="text-5xl md:text-7xl lg:text-8xl font-bold tracking-widest text-emerald-100 drop-shadow-[0_0_15px_rgba(52,211,153,0.4)] leading-tight">
              Avaka：島嶼的維度
            </h1>
          </div>
          
          <!-- 導言放大 -->
          <p class="text-emerald-200/80 tracking-widest max-w-3xl mx-auto mb-16 leading-relaxed text-xl md:text-2xl font-light">
            「造船不能只看地上的麻，要看天上的雲。」<br/><br/>
            一部順應自然時序與現代工業碰撞的互動敘事。
          </p>
        </div>

        <!-- 按鈕文字放大 (將 bottom-12 改為 bottom-6 讓位置往下) -->
        <button onclick="scrollToContent()" class="absolute bottom-6 text-emerald-500/70 hover:text-emerald-300 transition-colors flex flex-col items-center animate-bounce group cursor-pointer relative z-10">
          <span class="text-sm md:text-base mb-3 tracking-[0.3em] uppercase group-hover:text-emerald-300 transition-colors">Read Script</span>

        </button>
      </header>

      <!-- 腳本內容區 -->
      <main id="script-content" class="max-w-5xl mx-auto px-6 py-20 space-y-36 relative z-10">
        
        <!-- 情境腳本區塊 -->
        <section>
          <div class="flex flex-col items-center mb-20 text-center">
            <i data-lucide="leaf" class="w-10 h-10 text-emerald-500 mb-6 opacity-80"></i>
            <!-- 區塊標題放大 -->
            <h2 class="text-4xl md:text-5xl font-bold text-emerald-50 tracking-[0.2em] mb-4">環境情境腳本</h2>

          </div>

          <div class="space-y-20 relative">
            <!-- 連接線 -->
            <div class="absolute left-[36px] md:left-[47px] top-10 bottom-10 w-px bg-gradient-to-b from-emerald-900 via-emerald-700/50 to-emerald-900 hidden md:block"></div>
            
            ${scenarios.map(scene => `
              <div class="relative z-10 flex flex-col md:flex-row gap-8 md:gap-10 group">
                <!-- 時間節點指示器 (整體微調放大) -->

                  <div class="w-24 h-24 rounded-full bg-[#01120d] border-2 ${scene.borderColor} flex flex-col items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.1)] group-hover:scale-110 transition-transform duration-500">

                </div>

                <!-- 腳本卡片 -->
                <div class="flex-1 bg-gradient-to-br ${scene.themeColor} backdrop-blur-xl rounded-2xl border ${scene.borderColor} overflow-hidden shadow-2xl transition-all duration-500 hover:shadow-[0_0_40px_rgba(16,185,129,0.1)] hover:-translate-y-1">
                  
                  <!-- 卡片標頭 -->
                  <div class="px-8 py-6 border-b border-emerald-800/30 flex justify-between items-center bg-black/20">
                    <!-- 腳本標題放大 -->
                    <h3 class="text-2xl md:text-3xl font-bold text-emerald-50 tracking-wider flex flex-col md:flex-row md:items-center gap-4 leading-normal">
                      <span class="text-base md:text-lg px-4 py-1 border border-emerald-500/30 rounded-md bg-black/40 inline-block w-fit font-sans-custom tracking-widest">
                        ${scene.title.match(/【(.*?)】/)?.[1] || ""}
                      </span>
                      <span class="opacity-90 leading-relaxed">
                        ${scene.title.replace(/【.*?】\s*——?\s*/, '')}
                      </span>
                    </h3>
                    <!-- 手機版月份標籤放大 -->
                    <span class="md:hidden text-sm md:text-base font-bold text-emerald-950 bg-emerald-400 px-4 py-2 rounded-full tracking-widest font-sans-custom">
                      ${scene.month}
                    </span>
                  </div>
                  
                  <div class="p-8 md:p-10 space-y-10">
                    <!-- 系統與限制 -->
                    <div class="grid md:grid-cols-2 gap-8">
                      <div class="bg-rose-950/20 rounded-xl p-6 border border-rose-900/30 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-rose-500/50"></div>
                        <!-- 小標題放大 -->
                        <div class="flex items-center space-x-2 text-rose-400 mb-3">
                          <i data-lucide="triangle-alert" class="w-5 h-5"></i>
                          <span class="text-base md:text-lg font-bold tracking-widest font-sans-custom">環境限制</span>
                        </div>
                        <!-- 內文放大 -->
                        <p class="text-rose-200/90 text-base md:text-lg leading-relaxed tracking-wide">${scene.restriction}</p>
                      </div>

                      <div class="bg-emerald-950/40 rounded-xl p-6 border border-emerald-800/30 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-emerald-500/30"></div>
                        <div class="flex items-center space-x-2 text-emerald-400 mb-3">
                          <i data-lucide="calendar" class="w-5 h-5"></i>
                          <span class="text-base md:text-lg font-bold tracking-widest font-sans-custom">系統提示</span>
                        </div>
                        <p class="text-emerald-200/80 text-base md:text-lg leading-relaxed tracking-wide">"${scene.systemPrompt}"</p>
                      </div>
                    </div>

                    <!-- 劇本對白 -->
                    <div>
                      <div class="flex items-center space-x-2 mb-8 border-b border-emerald-800/30 pb-3">
                        <i data-lucide="message-square" class="w-5 h-5 text-emerald-500"></i>
                        <span class="text-base md:text-lg font-bold text-emerald-400 tracking-[0.2em] uppercase font-sans-custom">Dialogues</span>
                      </div>
                      <div class="space-y-8 px-2 md:px-4">
                        ${scene.dialogues.map(dlg => `
                          <div class="flex flex-col md:flex-row gap-3 md:gap-8">
                            <div class="md:w-32 md:text-right shrink-0 mt-1.5">
                              <!-- 角色名牌放大 -->
                              <span class="inline-block text-sm md:text-base font-bold tracking-widest text-emerald-600 bg-emerald-950/80 border border-emerald-800/50 px-3 py-1.5 rounded font-sans-custom shadow-sm">
                                ${dlg.role}
                              </span>
                            </div>
                            <!-- 對白文字大幅度放大，增加文學感 -->
                            <p class="text-emerald-100/95 leading-loose text-xl md:text-2xl tracking-wide font-medium">
                              ${dlg.text}
                            </p>
                          </div>
                        `).join('')}
                      </div>
                    </div>

                    <!-- 抉擇路徑 -->
                    <div class="bg-black/30 rounded-xl p-8 border border-emerald-900/50 mt-4">
                      <div class="flex items-center space-x-2 mb-4">
                        <i data-lucide="git-branch" class="w-5 h-5 text-emerald-400"></i>
                        <span class="text-base md:text-lg font-bold text-emerald-400 tracking-[0.2em] uppercase font-sans-custom">Player Choice</span>
                      </div>
                      <!-- 抉擇文字放大 -->
                      <p class="text-emerald-300/90 leading-relaxed text-lg md:text-xl font-medium pl-6 md:pl-8 border-l-2 border-emerald-700/50 tracking-wide">
                        ${scene.choice}
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>

        <!-- 分隔線 -->
        <div class="flex justify-center py-12">
          <i data-lucide="sparkles" class="w-8 h-8 text-emerald-700 opacity-50"></i>
        </div>

        <!-- 結局結算區塊 -->
        <section>
          <div class="flex flex-col items-center mb-20 text-center">
            <i data-lucide="award" class="w-10 h-10 text-emerald-500 mb-6 opacity-80"></i>
            <h2 class="text-4xl md:text-5xl font-bold text-emerald-50 tracking-[0.2em] mb-4">文化韌性評分</h2>
            <div class="w-32 h-px bg-gradient-to-r from-transparent via-emerald-500/50 to-transparent"></div>
          </div>

          <div class="space-y-12">
            ${endings.map(ending => `
              <div class="bg-emerald-950/40 backdrop-blur-md rounded-3xl p-8 md:p-12 ${ending.border} border hover:-translate-y-1 transition-all duration-300 ${ending.glow}">
                
                <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 pb-8 border-b border-emerald-800/30">
                  <div>
                    <div class="flex items-center space-x-4 mb-4">
                      <!-- 評分標籤放大 -->
                      <span class="text-sm md:text-base font-bold text-emerald-500/70 tracking-widest bg-emerald-950 px-3 py-1.5 rounded border border-emerald-800/50 font-sans-custom">
                        ENDING TIER
                      </span>
                      <span class="text-base md:text-lg text-emerald-400/90 tracking-widest font-sans-custom font-bold">${ending.tier}</span>
                    </div>
                    <!-- 結局標題放大 -->
                    <h3 class="text-3xl md:text-4xl lg:text-5xl font-bold tracking-wider ${ending.color} flex flex-col md:flex-row md:items-center gap-5 mt-2 leading-tight">
                      <span class="text-base md:text-xl px-5 py-2 border-2 ${ending.border} rounded-full bg-black/20 shadow-inner inline-block w-fit font-sans-custom tracking-widest">
                        ${ending.title.match(/【(.*?)】/)?.[1] || ""}
                      </span>
                      <span>
                        ${ending.title.replace(/【.*?】\s*/, '')}
                      </span>
                    </h3>
                  </div>
                  <div class="mt-8 md:mt-0">
                    <span class="inline-block px-5 py-3 bg-black/40 border border-emerald-800/50 rounded-xl text-emerald-300 text-base md:text-lg tracking-widest shadow-inner font-sans-custom font-bold">
                      SCORE: ${ending.score}
                    </span>
                  </div>
                </div>

                <div class="grid md:grid-cols-12 gap-10">
                  <!-- 條件 -->
                  <div class="md:col-span-4">
                    <h4 class="text-sm md:text-base font-bold text-emerald-500 tracking-[0.2em] uppercase mb-4 flex items-center font-sans-custom">
                      <div class="w-2 h-2 rounded-full bg-emerald-500 mr-3"></div>
                      達成條件
                    </h4>
                    <!-- 條件內文放大 -->
                    <p class="text-emerald-200/80 text-base md:text-lg leading-relaxed tracking-wide">
                      ${ending.condition}
                    </p>
                  </div>

                  <!-- 文本 -->
                  <div class="md:col-span-8 bg-black/20 rounded-2xl p-8 border border-emerald-800/20">
                    <h4 class="text-sm md:text-base font-bold text-emerald-500 tracking-[0.2em] uppercase mb-6 flex items-center font-sans-custom">
                      <div class="w-2 h-2 rounded-full bg-emerald-500 mr-3"></div>
                      敘事文本
                    </h4>
                    <div class="space-y-6">
                      <!-- 敘事內文大幅度放大 -->
                      ${ending.text.map(para => `
                        <p class="text-emerald-50/90 leading-loose text-xl md:text-2xl tracking-wide">
                          ${para}
                        </p>
                      `).join('')}
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>

      </main>
    `;

        // 渲染 HTML 到畫面上
        appContainer.innerHTML = htmlContent;

        // 初始化 Lucide 圖標
        lucide.createIcons();

        // 觸發進場與文字碎裂重組動畫
        setTimeout(() => {
            document.getElementById('hero-content').classList.add('active');
            initShatterAnimation();
        }, 100);

    </script>
</body>

</html>

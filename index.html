            "孩子要上學，油費要繳，時間不等人，你在這些現實壓力裡嘗試找到縫隙，幾塊工業材料省了些工夫，但你沒有就此撒手。你還是去敲了耆老的門，還是問了那幾個不問不會有人主動說的問題：材料要怎麼選、哪道工序不能跳過。": "“Children need school, fuel needs to be paid for, and time waits for no one. Amidst these real-life pressures, you tried to find cracks. A few industrial materials saved some effort, but you did not let go entirely. You still knocked on the elder’s door, still asked those few questions that no one would answer unless asked: how to choose materials, and which process cannot be skipped.",
            "孩子要上學，油費要繳，時間不等人，你在這些現實壓力裡嘗試找到縫隙，幾塊工業材料省了些工夫，但你沒有就此撒手。你還是去敲了耆老的門，還是問了那幾個不問不會有人主動說的問題：材料要怎麼選、哪道工序不能跳過": "“Children need school, fuel needs to be paid for, and time waits for no one. Amidst these real-life pressures, you tried to find cracks. A few industrial materials saved some effort, but you did not let go entirely. You still knocked on the elder’s door, still asked those few questions that no one would answer unless asked: how to choose materials, and which process cannot be skipped",
            "船造好的時候，你自己也說不清它到底是傳統還是現代。但或許這才是最誠實的答案，蘭嶼從來就不是一座博物館，人們在這裡過的是真實的生活，傳統也一直在真實的生活裡摩擦、磨損、又重新長出新的樣子": "“When the boat was finished, you couldn't tell if it was traditional or modern. But perhaps that is the most honest answer. Lanyu has never been a museum; people live real lives here, and tradition is always rubbing, wearing down, and growing into new shapes in real life",
            "「月份卡說——本回合移動不耗 AP，這是立春的禮物。": "“The Month Card says — movement does not consume AP in this round, this is the gift of Li Chun.",
            "但我要提醒你們一件事：下個月是 Kapowan，招魚祭的月份，山林會封閉整整一個月。你現在手上的 Avaka 原料還夠嗎？": "“But I want to remind you of one thing: next month is Kapowan, the month of the fish-calling ritual — the mountain forest will be closed for a whole month. Do you currently have enough Avaka raw materials in your hand?",
            "但我要提醒你們一件事：下個月是 Kapowan，招魚祭的月份，山林會封閉整整一個月。你現在手上的 Avaka 原料還夠嗎": "“But I want to remind you of one thing: next month is Kapowan, the month of the fish-calling ritual — the mountain forest will be closed for a whole month. Do you currently have enough Avaka raw materials in your hand?",
            "（燈光可稍暗，或主持人拿起月份卡展示給全場看）": "(The lights can be slightly dimmed, or the host holds up the Month Card to show the class)",
            "「灘頭起了白煙。招魚祭開始了。": "“White smoke rises from the beach. The fish-calling ritual has begun.",
            "所有男人禁止進入山林，門戶關閉——這叫做 Paneneb，是禁忌。": "“All men are forbidden from entering the mountain forest; the gates are closed — this is called Paneneb, a taboo.",
            "所有男人禁止進入山林，門戶關閉——這叫做 Paneneb，是": "“All men are forbidden from entering the mountain forest; the gates are closed — this is called Paneneb, a taboo",
            "現在，山林封閉，你無法執行採集行動。如果你上個月沒有存夠材料，你面臨三個選擇：」": "“Now, the mountain forest is closed, and you cannot perform the Gather action. If you did not stockpile enough materials last month, you face three options:”",
            "青年：「糟了！我的 Avaka 原料用完了，但現在上山會觸犯禁忌……」": "Youth: “Oh no! My Avaka raw materials are depleted, but going up the mountain now would violate the taboo...”",
            "中生代：「這就是為什麼老人家說 Kashyman 月要拼命存貨。現在你只能跟我去商店買尼龍繩，或者枯等一個月，看著進度落後。」": "Negotiator: “This is why the elders said to stock up eagerly during Kashyman. Now you can only buy nylon rope with me at the shop, or wait dryly for a month and watch your progress fall behind.”",
            "中生代：「這就是為什麼老人家說 Kashyman 月要拼命存貨。現在你只能跟我去商店買尼龍繩，或者枯坐一個月，看著進度落後。」": "Negotiator: “This is why the elders said to stock up eagerly during Kashyman. Now you can only buy nylon rope with me at the shop, or wait dryly for a month and watch your progress fall behind.”",
            "耆老：「飛魚隨著黑潮而來，而我們則順應時節。這是海洋的規矩，我們要好好遵守。」": "Elder: “Flying fish come with the Kuroshio, and we conform to the seasons. This is the ocean's rule — we must obey it well.”",
            "「天空陰雲密佈。 突如其來的降雨，讓你在灘頭曝曬的 Avaka 纖維陷入腐爛危機。": "“The sky is overcast with dark clouds. The sudden rain puts your Avaka fiber drying on the beach in danger of rotting.",
            "規則說：曝曬中的材料，若你沒有預留 1 AP 進行維護，下回合自動報廢。」": "“The rules say: for materials being dried, if you do not reserve 1 AP for maintenance, they will automatically rot next round.”",
            "耆老（突然抬頭看天）：「孩子，做船不能只看地上的麻，要看天上的雲。快收起來！」": "Elder (suddenly looking up at the sky): “Child, when building a boat you cannot only watch the hemp on the ground — you must watch the clouds in the sky. Quickly bring it inside!”",
            "「如果你的 AP 已經用完了——那些材料，就從你的存貨裡劃掉吧。」": "“If your AP is already depleted — those materials will be crossed off your inventory.”",
            "「這是蘭嶼夜曆中最不吉祥的月份。這個月，專門製作貝灰，不允許舉行婚禮、造屋，也不允許落成禮。 即便你的材料已齊備，KP 已達標——現在也絕對不能動工填縫。」": "“This is the most inauspicious month in Lanyu’s calendar. This month is dedicated to making shell ash, and no weddings, house building, or completion ceremonies are allowed. Even if your materials are ready and KP has met the threshold — you must never start caulking now.”",
            "中生代（看著材料）：「這就是『儀式時間』的邏輯。你得學會等待。如果你現在強行完工，這艘船在部落眼中將失去靈魂。」": "Negotiator (looking at the materials): “This is the logic of ritual time. You must learn to wait. If you force completion now, this boat will lose its soul in the eyes of the tribe.”",
            "青年（緊張地）：「但我只剩兩個月就要結算了！如果不現在做，我怕來不及完成……」": "Youth (nervously): “But I only have two months left until settlement! If I don't do it now, I'm afraid I won't make it in time...”",
            "耆老（平靜地）：「你現在可以去學你還沒學到的東西。等待，不是什麼都不做。」": "Elder (calmly): “You can use this time to learn what you haven't learned yet. Waiting does not mean doing nothing.”",
            "「這是屬於手工藝的月份。 男人冶鐵織繩，女人織布——整個部落都在做手工。": "“This is a month dedicated to handicrafts. Men forge iron and weave ropes, women weave cloth — the entire tribe is doing handcrafts.",
            "本月，執行『捻線』不再消耗任何 AP。": "“This month, executing ‘Twining Rope’ no longer consumes any AP.",
            "耆老（展露出笑意）：「看吧，只要你順應時序，土地會給你最後的補償。快動手，讓這條船趕在明年飛魚祭前下水！」": "Elder (showing a smile): “You see — follow the seasonal order, and the land gives you its final reward. Get to work! Let this boat launch before next year's Flying Fish Ritual!”",
            "這句話不需特別強調，只是讓誘惑自然存在於遊戲場域中。接著繼續讓學生完成本回合行動，不做評論。": "This sentence does not need special emphasis; just let the temptation naturally exist in the game space. Then let students complete their actions in this round without comment.",
            "教學提示：朗讀時不要搭配投影片說明。讓語言單獨產生作用，讓學生先感受情境。": "Pedagogical Tip: Do not use slides during reading. Let the language speak for itself, and let students feel the context first.",
            "說完後不要繼續解釋，給學生 30 秒 of 安靜決策時間。觀察哪些組 of 青年開始快速往山林移動採集，哪些組忽略了這個預警。": "Do not explain further after speaking; give students 30 seconds of silent decision-making time. Observe which groups’ Youth begin to move quickly to the mountain forest to gather, and which groups ignore this pre-warning.",
            "說完後不要繼續解釋，給學生 30 秒的安靜決策時間。觀察哪些組的青年開始快速往山林移動採集，哪些組忽略了這個預警。": "Do not explain further after speaking; give students 30 seconds of silent decision-making time. Observe which groups’ Youth begin to move quickly to the mountain forest to gather, and which groups ignore this pre-warning.",
            "讓這個回合跑完整。不要催促，讓各組自行完成最後行動與完工計算。主持人保持安靜，只在必要時回答規則問題。讓結局自然發生。": "Let this round run completely. Do not rush; let each group finish their final actions and finish ship calculations. Host remains quiet, only answering rule questions when necessary. Let the endings happen naturally.",
            "讓學生從遊戲第一回合就進入「預判未來、提前規劃」的思維，模擬文化知識中的預備行為邏輯。": "Allow students to enter an ‘anticipate the future and plan ahead’ mindset from the very first round, simulating preparatory behavior logic in cultural knowledge.",
            "透過學徒機制，體驗「默會知識」的場域依賴性——知識需要在場才能傳遞。": "Through the Apprentice Mechanism, experience the field-dependency of ‘tacit knowledge’ — knowledge must be present in the field to be transmitted.",
            "手指也忘了。忘了纖維來回時的阻力，忘了怎麼判斷木材的品種。": "Your fingers have forgotten too. Forgotten the resistance when the fibers move back and forth, forgotten how to identify wood species.",
            "分數結算（從高分到低分唸出文本）": "Score Settlement (read out the narratives from high to low score)",
            "將手中材料轉交給同區域的另一名玩家，緩解物料匱乏": "Transfer materials in hand to another player in the same area to relieve material scarcity.",

            // --- Classroom 100% final single clean Chinese translation (1 keys) ---
            "後來，透過科學資料，證實了 Avaka 纖維吸水之後會膨脹。你忽然明白，老人說『讓船呼吸』不只是一種想像，是造船的學問。當海水滲進縫隙，纖維膨脹後，船反而變得更緊實。可以拆，可以修，可以一塊一塊換掉，再一次出海。": "Later, scientific data confirmed that Avaka fibers expand after absorbing water. You suddenly realized that when the elders said ‘let the boat breathe,’ it was not just a metaphor, but a profound knowledge of boat building. When sea water seeps into the cracks and the fibers expand, the boat becomes tighter instead. It can be disassembled, repaired, and replaced piece by piece, to set sail again.",

            "在山林、灘頭工作室、商店之間移動。(青年 0 AP)": "Move between the Forest, the Beach Workshop and the Store. (0 AP for the Youth)",
            "依序完成六道工序：①砍伐剝皮 → ②摩擦軟化 → ③劃痕撕絲 → ④曝曬乾燥 → ⑤理線捻繩 → ⑥填縫完工。每完成一道要等到下個月才能做下一道；①會產出材料，②至⑥各消耗 1 份材料。": "Complete the six steps in order: ① Chop & Peel → ② Rub to soften → ③ Score & Strip → ④ Dry → ⑤ Twine → ⑥ Caulk & finish. After each step you must wait until next month for the following one; ① yields materials, ② to ⑥ each use 1 material.",
            "向耆老請益": "Ask the Elder",

            "用科學觀點印證祖先的經驗。成功率 50% + 剩餘 KP × 5%（中生代 +20%），成功獲得 +4 分與 2 份材料。": "Confirm the ancestors' experience with science. Success rate 50% + remaining KP × 5% (Middle Generation +20%); success grants +4 points and 2 materials.",

            "「你是橋樑。你小時候看過老人家怎麼做，所以學得比年輕人快；你也在另一種生活裡待過，所以知道怎麼把老人家的話說給年輕人聽。老人家能說出什麼東西不見了，你還能想出它可以轉化成什麼。這個部落要怎麼走下去，很大一部分要看你。」": "\"You are the bridge. You watched the elders work when you were small, so you learn faster than the young; you have also lived another kind of life, so you know how to put the elders' words in a way the young can hear. The elders can say what has been lost; you can also imagine what it could become. Much of where this village goes next depends on you.\"",

            // Rulebook review fixes (2026-10-12)

            "代表對傳統工藝的理解，主要靠向人請益來增加；被耆老指導、第 11 月與耆老在同一區域時也會增加。KP 是解鎖高階工序的途徑——捻繩需 ": "Your understanding of the traditional craft. It grows mainly by asking others; being guided by the Elder, or being in the Elder's area in Month 11, also adds to it. KP unlocks the advanced steps: twining needs ",
            "依序完成六道工序：①砍伐剝皮 → ②摩擦軟化 → ③劃痕撕絲 → ④曝曬乾燥 → ⑤理線捻繩 → ⑥填縫完工。每完成一道要等到下個月才能做下一道；①會產出材料，②至⑥各消耗 1 份材料。例外：耆老填縫不耗 AP、3 月所有工序少 1 AP、12 月捻繩不耗 AP。": "Complete the six steps in order: ① Chop & Peel → ② Rub to soften → ③ Score & Strip → ④ Dry → ⑤ Twine → ⑥ Caulk & finish. After each step you must wait until next month for the following one; ① yields materials, ② to ⑥ each use 1 material. Exceptions: the Elder caulks for 0 AP, every step costs 1 AP less in Month 3, and twining costs 0 AP in Month 12.",

        // Pre-compile regular expressions for blazing fast execution and 100% regex-safety
        const escapeRegex = (str) => str.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        
        const ZH_KEYS = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
        const ZH_REGEXP = new RegExp(ZH_KEYS.map(escapeRegex).join('|'), 'g');

        const REVERSE_GLOSSARY = {};
        for (let [zh, en] of Object.entries(GLOSSARY)) {
            REVERSE_GLOSSARY[en] = zh;
        }
        const EN_KEYS = Object.keys(REVERSE_GLOSSARY).sort((a,b) => b.length - a.length);
        const EN_REGEXP = new RegExp(EN_KEYS.map(escapeRegex).join('|'), 'g');

        // High-performance dynamic DOM translator
        function translateDOM(node, lang) {
            if (!node) return;

                const text = node.textContent;
                if (!text || !text.trim()) return;
                
                let translated;
                if (lang === 'en') {
                    translated = text.replace(ZH_REGEXP, (match) => GLOSSARY[match] || match);
                } else {
                    translated = text.replace(EN_REGEXP, (match) => REVERSE_GLOSSARY[match] || match);
                }
                
                if (translated !== text) {
                    node.textContent = translated;
                }
            } else {
                if (node.nodeName === 'SCRIPT' || node.nodeName === 'STYLE') return;
                
                if (node.placeholder) {
                    node.placeholder = lang === 'en' 
                        ? node.placeholder.replace(ZH_REGEXP, (match) => GLOSSARY[match] || match)
                        : node.placeholder.replace(EN_REGEXP, (match) => REVERSE_GLOSSARY[match] || match);
                }
                
                if (node.title) {
                    node.title = lang === 'en'
                        ? node.title.replace(ZH_REGEXP, (match) => GLOSSARY[match] || match)
                        : node.title.replace(EN_REGEXP, (match) => REVERSE_GLOSSARY[match] || match);
                }

                // Concurrent-safe child traversal using static array
                const children = Array.from(node.childNodes);
                for (let child of children) {
                    translateDOM(child, lang);
                }
            }
        }

        function applyRulesLanguage() {
            const t = TRANSLATIONS[currentLang];
            
            // 1. Update cover page static text
            const subtitleEl = document.getElementById('cover-subtitle');
            if (subtitleEl) {
                subtitleEl.textContent = t["cover-subtitle"];
                if (typeof applyBlurText === 'function') {
                    applyBlurText('cover-subtitle', { direction: 'top', baseDelay: 400, delay: 50 });
                }
            }
            
            const titleZhEl = document.getElementById('cover-title-zh');
            if (titleZhEl) {
                titleZhEl.textContent = t["cover-title-zh"];
                if (typeof applyBlurText === 'function') {
                    applyBlurText('cover-title-zh', { direction: 'bottom', baseDelay: 1800, delay: 70 });
                }
            }
            
            for (let i = 0; i <= 2; i++) {
                const descLine = document.getElementById(`cover-desc-line-${i}`);
                if (descLine) {
                    descLine.textContent = t[`cover-desc-line-${i}`];
                    if (typeof applyBlurText === 'function') {
                        applyBlurText(`cover-desc-line-${i}`, { direction: 'bottom', baseDelay: 2500 + i * 700, delay: 35 });
                    }
                }
            }
            
            const enterBtn = document.getElementById('cover-enter-btn');
            if (enterBtn) {
                const isSea = enterBtn.textContent.includes('出海') || enterBtn.textContent.includes('Sail');
                enterBtn.textContent = isSea ? t["cover-enter-btn-sea"] : t["cover-enter-btn-forest"];
            }
            
            // 2. Translate global navigation menu items
            const gnavCover = document.querySelector('#gnav-cover a');
            if (gnavCover) gnavCover.textContent = t["gnav-cover"];
            const gnavRulebook = document.querySelector('#gnav-rulebook a');
            if (gnavRulebook) gnavRulebook.textContent = t["gnav-rulebook"];
            const gnavScenario = document.querySelector('#gnav-scenario a');
            if (gnavScenario) gnavScenario.textContent = t["gnav-scenario"];
            const gnavFieldwork = document.querySelector('#gnav-fieldwork a');
            if (gnavFieldwork) gnavFieldwork.textContent = t["gnav-fieldwork"];
            const gnavClassroom = document.querySelector('#gnav-classroom a');
            if (gnavClassroom) gnavClassroom.textContent = t["gnav-classroom"];

            // Update Gooey text active effect if active
            const gooeyText = document.getElementById('gooey-text');
            if (gooeyText && gooeyText.classList.contains('active')) {
                const activeLi = document.querySelector('#gooey-nav-list li.active');
                if (activeLi) {
                    gooeyText.innerText = activeLi.querySelector('a').innerText;
                }
            }

            // 3. Clean-up & re-render SPA subpages
            const activeSection = document.querySelector('.page-section.page-active');
            if (activeSection) {
                const activePageId = activeSection.id.replace('page-', '');
                document.body.dataset.currentPage = ''; // Force re-render
                initPage(activePageId);
            }
        }

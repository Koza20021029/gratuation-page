    <!-- Global event listener tracking wrapper for auto-cleanup in dynamic SPA router -->
    <script>
        (function() {
            const originalAdd = window.addEventListener;
            const originalRemove = window.removeEventListener;
            let trackedListeners = [];
            let isTracking = false;

            window.startTrackingSpaListeners = function() {
                isTracking = true;
            };

            window.stopTrackingAndCleanupSpaListeners = function() {
                isTracking = false;
                trackedListeners.forEach(({ type, listener, options }) => {
                    originalRemove.call(window, type, listener, options);
                });
                trackedListeners = [];
            };

            window.addEventListener = function(type, listener, options) {
                if (isTracking) {
                    trackedListeners.push({ type, listener, options });
                }
                originalAdd.call(window, type, listener, options);
            };

            window.removeEventListener = function(type, listener, options) {
                if (isTracking) {
                    trackedListeners = trackedListeners.filter(
                        item => !(item.type === type && item.listener === listener)
                    );
                }
                originalRemove.call(window, type, listener, options);
            };
        })();
    </script>

        }

        .gooey-nav-container {
            position: relative;
        }
        .gooey-nav-container nav {
            display: flex;
            position: relative;
            transform: translate3d(0,0,0.01px);
        }
        .gooey-nav-container nav ul {
            display: flex;
            gap: 0.4em;
            list-style: none;
            padding: 0 0.5em;
            margin: 0;
            position: relative;
            z-index: 3;
            color: rgba(167,243,208,0.9);
            text-shadow: 0 1px 1px hsl(165deg 90% 5% / 0.5);
        }
        .gooey-nav-container nav ul li {
            border-radius: 100vw;
            position: relative;
            cursor: pointer;
            transition: color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 0.5px 1.5px transparent;
            color: rgba(167,243,208,0.9);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .gooey-nav-container nav ul li a {
            display: inline-block;
            padding: 0.55em 1.1em;
            text-decoration: none;
            color: inherit;
        }
        .gooey-nav-container nav ul li:focus-within:has(:focus-visible) {
            box-shadow: 0 0 0.5px 1.5px #34d399;
        }
        .gooey-nav-container nav ul li::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 100vw;
            background: #34d399;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: -1;
        }
        .gooey-nav-container nav ul li.active {
            color: #01120d;
            text-shadow: none;
        }
        .gooey-nav-container nav ul li.active::after {
            opacity: 1;
            transform: scale(1);
        }
        /* effect spans */
        .gooey-nav-container .effect {
            position: absolute;
            left: 0; top: 0;
            width: 0; height: 0;
            opacity: 1;
            pointer-events: none;
            display: grid;
            place-items: center;
            z-index: 1;
        }
        .gooey-nav-container .effect.text {
            color: rgba(167,243,208,0.9);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: color 0.3s ease;
            white-space: nowrap;
        }
        .gooey-nav-container .effect.text.active { color: #01120d; }
        .gooey-nav-container .effect.filter {
            filter: url(#goo-nav-filter);
        }
        .gooey-nav-container .effect.filter::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #34d399;
            transform: scale(0);
            opacity: 0;
            z-index: -1;
            border-radius: 100vw;
        }
        .gooey-nav-container .effect.active::after {
            animation: gooey-pill 0.3s ease both;
        }
        @keyframes gooey-pill {
            to { transform: scale(1); opacity: 1; }
        }
        .gooey-particle, .gooey-point {
            display: block;
            opacity: 0;
            width: 20px; height: 20px;
            border-radius: 100%;
            transform-origin: center;
        }
        .gooey-particle {
            --time: 5s;
            position: absolute;
            top: calc(50% - 8px);
            left: calc(50% - 8px);
            animation: gooey-particle calc(var(--time)) ease 1 -350ms;
        }
        .gooey-point {
            background: var(--color);
            opacity: 1;
            animation: gooey-point calc(var(--time)) ease 1 -350ms;
        }
        @keyframes gooey-particle {
            0%   { transform: rotate(0deg) translate(var(--start-x), var(--start-y)); opacity:1; animation-timing-function:cubic-bezier(0.55,0,1,0.45); }
            70%  { transform: rotate(calc(var(--rotate)*.5)) translate(calc(var(--end-x)*1.2),calc(var(--end-y)*1.2)); opacity:1; animation-timing-function:ease; }
            85%  { transform: rotate(calc(var(--rotate)*.66)) translate(var(--end-x),var(--end-y)); opacity:1; }
            100% { transform: rotate(calc(var(--rotate)*1.2)) translate(calc(var(--end-x)*.5),calc(var(--end-y)*.5)); opacity:1; }
        }
        @keyframes gooey-point {
            0%   { transform:scale(0); opacity:0; animation-timing-function:cubic-bezier(0.55,0,1,0.45); }
            25%  { transform:scale(calc(var(--scale)*.25)); }
            38%  { opacity:1; }
            65%  { transform:scale(var(--scale)); opacity:1; animation-timing-function:ease; }
            85%  { transform:scale(var(--scale)); opacity:1; }
            100% { transform:scale(0); opacity:0; }
        }

    <!-- GooeyNav 純 JS 實作 -->
    <script>
    (function () {
        const PARTICLE_COUNT     = 15;
        const PARTICLE_DISTANCES = [90, 10];
        const PARTICLE_R         = 100;
        const ANIMATION_TIME     = 600;
        const TIME_VARIANCE      = 300;
        const COLORS             = [1, 2, 3, 1, 2, 3, 1, 4];

        let activeIndex = -1; // -1 = 尚未初始化

        const noise = (n = 1) => n / 2 - Math.random() * n;

        function getXY(distance, pointIndex, totalPoints) {
            const angle = ((360 + noise(8)) / totalPoints) * pointIndex * (Math.PI / 180);
            return [distance * Math.cos(angle), distance * Math.sin(angle)];
        }

        function createParticle(i, t, d, r) {
            const rotate = noise(r / 10);
            return {
                start: getXY(d[0], PARTICLE_COUNT - i, PARTICLE_COUNT),
                end:   getXY(d[1] + noise(7), PARTICLE_COUNT - i, PARTICLE_COUNT),
                time:  t,
                scale: 1 + noise(0.2),
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                rotate: rotate > 0 ? (rotate + r / 20) * 10 : (rotate - r / 20) * 10
            };
        }

        function makeParticles(el) {
            const bubbleTime = ANIMATION_TIME * 2 + TIME_VARIANCE;
            el.style.setProperty('--time', `${bubbleTime}ms`);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = ANIMATION_TIME * 2 + noise(TIME_VARIANCE * 2);
                const p = createParticle(i, t, PARTICLE_DISTANCES, PARTICLE_R);
                el.classList.remove('active');

                setTimeout(() => {
                    const particle = document.createElement('span');
                    const point    = document.createElement('span');
                    particle.classList.add('gooey-particle');
                    particle.style.setProperty('--start-x', `${p.start[0]}px`);
                    particle.style.setProperty('--start-y', `${p.start[1]}px`);
                    particle.style.setProperty('--end-x',   `${p.end[0]}px`);
                    particle.style.setProperty('--end-y',   `${p.end[1]}px`);
                    particle.style.setProperty('--time',    `${p.time}ms`);
                    particle.style.setProperty('--scale',   `${p.scale}`);
                    particle.style.setProperty('--color',   `var(--color-${p.color}, white)`);
                    particle.style.setProperty('--rotate',  `${p.rotate}deg`);
                    point.classList.add('gooey-point');
                    particle.appendChild(point);
                    el.appendChild(particle);
                    requestAnimationFrame(() => el.classList.add('active'));
                    setTimeout(() => { try { el.removeChild(particle); } catch {} }, t);
                }, 30);
            }
        }

        function updateEffectPosition(liEl) {
            const container = document.getElementById('gooey-nav-container');
            const filterEl  = document.getElementById('gooey-filter');
            const textEl    = document.getElementById('gooey-text');
            if (!container || !filterEl || !textEl) return;

            const cRect = container.getBoundingClientRect();
            const pRect = liEl.getBoundingClientRect();
            const styles = {
                left:   `${pRect.x - cRect.x}px`,
                top:    `${pRect.y - cRect.y}px`,
                width:  `${pRect.width}px`,
                height: `${pRect.height}px`
            };
            Object.assign(filterEl.style, styles);
            Object.assign(textEl.style,   styles);
            textEl.innerText = liEl.querySelector('a').innerText;
        }

        // 公開函式：供 a 標籤的 onclick 呼叫
        window.gooeyNavClick = function (e, page) {
            e.preventDefault();
            const liEl = e.currentTarget.closest('li') || e.target.closest('li');
            const items = Array.from(document.querySelectorAll('#gooey-nav-list li'));
            const idx   = items.indexOf(liEl);
            if (idx === activeIndex) { router.go(page); return; }

            activeIndex = idx;

            // 更新 active class
            items.forEach((el, i) => el.classList.toggle('active', i === idx));

            updateEffectPosition(liEl);

            const filterEl = document.getElementById('gooey-filter');
            const textEl   = document.getElementById('gooey-text');

            // 清除舊粒子
            filterEl.querySelectorAll('.gooey-particle').forEach(p => filterEl.removeChild(p));

            // 重播文字閃現動畫
            textEl.classList.remove('active');
            void textEl.offsetWidth;
            textEl.classList.add('active');

            // 爆破粒子
            makeParticles(filterEl);

            // 執行路由切換
            router.go(page);
        };

        // 供 router 呼叫：同步高亮正確項目（不再重觸發粒子）
        window.gooeyNavSetActive = function (page) {
            const items = Array.from(document.querySelectorAll('#gooey-nav-list li'));
            const target = items.find(li => li.dataset.page === page);
            if (!target) return;
            const idx = items.indexOf(target);
            if (idx === activeIndex) return;
            activeIndex = idx;
            items.forEach((el, i) => el.classList.toggle('active', i === idx));
            updateEffectPosition(target);
            document.getElementById('gooey-text').innerText = target.querySelector('a').innerText;
            document.getElementById('gooey-text').classList.add('active');
        };
    })();
    </script>

    <script>
        const router = (() => {
            // 頁面 ID → section element 的映射
            const pages = {
                cover:     document.getElementById('page-cover'),
                rulebook:  document.getElementById('page-rulebook'),
                scenario:  document.getElementById('page-scenario'),
                fieldwork: document.getElementById('page-fieldwork'),
                classroom: document.getElementById('page-classroom'),
            };

            const globalNav   = document.getElementById('global-nav');
            const navLinks    = { cover: document.getElementById('gnav-cover'), rulebook: document.getElementById('gnav-rulebook'), scenario: document.getElementById('gnav-scenario'), fieldwork: document.getElementById('gnav-fieldwork'), classroom: document.getElementById('gnav-classroom') };

            // 記錄哪些頁面已初始化（避免重複執行 init）
            const initialized = { cover: true };

            let currentPage = 'cover';

            function go(pageId) {
                if (!pages[pageId]) return;
                if (currentPage === pageId) return;

                // 隱藏當前頁
                const prev = pages[currentPage];
                prev.classList.remove('page-active');

                // 切換導覽列顯示邏輯
                if (pageId === 'cover') {
                    globalNav.style.display = 'none';
                    document.body.style.overflow = 'hidden';
                } else {
                    globalNav.style.display = 'flex';
                    document.body.style.overflow = '';
                    window.scrollTo(0, 0);
                }

                // 更新 GooeyNav 高亮狀態
                if (typeof gooeyNavSetActive === 'function') gooeyNavSetActive(pageId);

                // 顯示目標頁
                currentPage = pageId;
                const next = pages[pageId];
                next.classList.add('page-active');

                // 控制 3D 流光背景動畫顯示狀態
                const beams = document.getElementById('beams-container');
                if (beams) {
                    if (pageId === 'rulebook') {
                        beams.style.opacity = '0.65';
                    } else {
                        beams.style.opacity = '0';
                    }
                }

                // 每次切換頁面都重新載入，確保語系與事件監聽器狀態完美重置，徹底消除效能卡頓與殘留
                initPage(pageId);

                // 更新瀏覽器網址 hash
                history.pushState({ page: pageId }, '', '#' + pageId);
            }

            // 瀏覽器返回鍵支援
            window.addEventListener('popstate', (e) => {
                const pageId = (e.state && e.state.page) ? e.state.page : 'cover';
                go(pageId);
            });

            return { go };
        })();

        // 根據 hash 決定初始頁面
        window.addEventListener('DOMContentLoaded', () => {
            const hash = location.hash.replace('#', '') || 'cover';
            if (hash !== 'cover') router.go(hash);
            // 封面預設：鎖定 overflow
            if (hash === 'cover') {
                document.body.style.overflow = 'hidden';
                document.getElementById('global-nav').style.display = 'none';
            }
        });
    </script>

    <!-- ===================================================
         封面頁：粒子特效 + 海洋動畫
    ==================================================== -->
    <script>
        (function initCover() {
            const canvas = document.getElementById('particleCanvas');
            let scrollProgress = 0;

            // ===== Canvas 2D 粒子系統（高相容性，保證可用）=====
            try {
                const ctx = canvas.getContext('2d');
                if (!ctx) throw new Error('2D context not supported');

                // --- 粒子設定 ---
                const COUNT = 180;
                const particles = [];

                // 螢幕尺寸
                let W = 0, H = 0;

                function resizeCanvas() {
                    const dpr = window.devicePixelRatio || 1;
                    W = window.innerWidth;
                    H = window.innerHeight;
                    canvas.width  = W * dpr;
                    canvas.height = H * dpr;
                    canvas.style.width  = W + 'px';
                    canvas.style.height = H + 'px';
                    ctx.scale(dpr, dpr);
                }
                window.addEventListener('resize', () => { resizeCanvas(); });
                resizeCanvas();

                // --- 色彩定義 ---
                const LAND_COLORS = [
                    [253, 230, 138],
                    [167, 243, 208],
                    [252, 211, 77],
                    [254, 243, 199],
                    [110, 231, 183],
                ];
                const OCEAN_COLORS = [
                    [34, 211, 238],
                    [56, 189, 248],
                    [207, 250, 254],
                    [14, 165, 233],
                    [125, 211, 252],
                ];

                function lerp(a, b, t) { return a + (b - a) * t; }
                function lerpColor(ca, cb, t) {
                    return [lerp(ca[0],cb[0],t), lerp(ca[1],cb[1],t), lerp(ca[2],cb[2],t)];
                }

                // --- 建立粒子（帶物理速度）---
                for (let i = 0; i < COUNT; i++) {
                    const li = Math.floor(Math.random() * LAND_COLORS.length);
                    const oi = Math.floor(Math.random() * OCEAN_COLORS.length);
                    particles.push({
                        // 正規化座標 [0,1]
                        x: Math.random(),
                        y: Math.random(),
                        z: Math.random(),           // 深度
                        // 物理速度（螢幕像素/ms）
                        dvx: 0,
                        dvy: 0,
                        // 基底漂浮速度
                        vx: (Math.random() - 0.5) * 0.00012,
                        vy: (Math.random() - 0.5) * 0.00012,
                        vz: (Math.random() - 0.5) * 0.00018,
                        baseR: 1.8 + Math.random() * 3,
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.3 + Math.random() * 0.7,
                        landColor: LAND_COLORS[li],
                        oceanColor: OCEAN_COLORS[oi],
                        alpha: 0.45 + Math.random() * 0.55,
                    });
                }

                // --- 滑鼠狀態（實際像素座標）---
                let mouseX = W * 0.5, mouseY = H * 0.5;
                let rawMouseX = W * 0.5, rawMouseY = H * 0.5;
                let mouseActive = false;    // 滑鼠是否在視窗內
                let mousePressed = false;

                window.addEventListener('mousemove', e => {
                    rawMouseX = e.clientX;
                    rawMouseY = e.clientY;
                    mouseActive = true;
                });
                window.addEventListener('mouseleave', () => { mouseActive = false; });
                window.addEventListener('mousedown',  () => { mousePressed = true;  });
                window.addEventListener('mouseup',    () => { mousePressed = false; });

                // 觸控支援
                window.addEventListener('touchmove', e => {
                    rawMouseX = e.touches[0].clientX;
                    rawMouseY = e.touches[0].clientY;
                    mouseActive = true;
                }, { passive: true });

                // 排斥半徑 & 引力切換（按住滑鼠吸引，放開排斥）
                const REPEL_R  = 160;   // 排斥範圍（像素）
                const ATTRACT_R = 200;  // 引力範圍（按住）
                const REPEL_STR = 6.0;
                const FRICTION  = 0.88; // 速度衰減（讓粒子回彈後自然停止）

                // --- 渲染迴圈 ---
                let lastT = performance.now();
                function tick(now) {
                    requestAnimationFrame(tick);
                    const coverSection = document.getElementById('page-cover');
                    if (!coverSection || !coverSection.classList.contains('page-active')) return;

                    const dt = Math.min(now - lastT, 50);
                    lastT = now;
                    const t = now * 0.001;

                    // 慣性滑鼠（整體場景視差）
                    mouseX += (rawMouseX - mouseX) * 0.06;
                    mouseY += (rawMouseY - mouseY) * 0.06;
                    const offX = (mouseX / W - 0.5) * 55;
                    const offY = (mouseY / H - 0.5) * 35;

                    // 清空
                    ctx.clearRect(0, 0, W, H);

                    // ── 游標光暈（繪製在粒子層底部）──
                    if (mouseActive) {
                        const auraR = mousePressed ? 220 : 140;
                        const auraA = mousePressed ? 0.18 : 0.10;
                        const auraCol = scrollProgress > 0.5
                            ? `34,211,238`
                            : `253,230,138`;

                        const aura = ctx.createRadialGradient(rawMouseX, rawMouseY, 0, rawMouseX, rawMouseY, auraR);
                        aura.addColorStop(0,   `rgba(${auraCol},${auraA})`);
                        aura.addColorStop(0.5, `rgba(${auraCol},${auraA * 0.4})`);
                        aura.addColorStop(1,   `rgba(${auraCol},0)`);
                        ctx.beginPath();
                        ctx.arc(rawMouseX, rawMouseY, auraR, 0, Math.PI * 2);
                        ctx.fillStyle = aura;
                        ctx.fill();

                        // 游標中心亮點
                        const dot = ctx.createRadialGradient(rawMouseX, rawMouseY, 0, rawMouseX, rawMouseY, 6);
                        dot.addColorStop(0, `rgba(${auraCol},0.9)`);
                        dot.addColorStop(1, `rgba(${auraCol},0)`);
                        ctx.beginPath();
                        ctx.arc(rawMouseX, rawMouseY, 6, 0, Math.PI * 2);
                        ctx.fillStyle = dot;
                        ctx.fill();
                    }

                    // ── 粒子更新 & 繪製 ──
                    const nearCursor = []; // 收集靠近游標的粒子，用於連線

                    for (let i = 0; i < COUNT; i++) {
                        const p = particles[i];

                        // 基底漂浮
                        p.x += p.vx * dt + Math.sin(t * p.speed * 0.7 + p.phase) * 0.00007;
                        p.y += p.vy * dt + Math.cos(t * p.speed * 0.5 + p.phase) * 0.00005;
                        p.z += p.vz * dt + Math.sin(t * p.speed * 0.3 + p.phase * 1.3) * 0.00014;

                        // 邊界循環
                        if (p.x < -0.2) p.x = 1.2;
                        if (p.x >  1.2) p.x = -0.2;
                        if (p.y < -0.2) p.y = 1.2;
                        if (p.y >  1.2) p.y = -0.2;
                        p.z = ((p.z % 1) + 1) % 1;

                        // 3D 深度透視 → 螢幕坐標
                        const depth = 0.3 + p.z * 0.7;
                        const sx = (p.x - 0.5) * W * depth + W * 0.5 + offX * depth;
                        const sy = (p.y - 0.5) * H * depth + H * 0.5 + offY * depth;

                        // ── 滑鼠交互物理 ──
                        if (mouseActive) {
                            const dx = sx - rawMouseX;
                            const dy = sy - rawMouseY;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (mousePressed && dist < ATTRACT_R) {
                                // 按住：吸引
                                const force = (1 - dist / ATTRACT_R) * REPEL_STR * 0.5;
                                p.dvx -= (dx / dist) * force;
                                p.dvy -= (dy / dist) * force;
                            } else if (!mousePressed && dist < REPEL_R && dist > 1) {
                                // 排斥
                                const force = (1 - dist / REPEL_R) * REPEL_STR;
                                p.dvx += (dx / dist) * force;
                                p.dvy += (dy / dist) * force;
                            }

                            if (dist < REPEL_R * 1.5) {
                                nearCursor.push({ sx, sy, dist, col: lerpColor(p.landColor, p.oceanColor, scrollProgress), depth });
                            }
                        }

                        // 套用物理速度（正規化座標偏移）
                        p.x += p.dvx * 0.0001;
                        p.y += p.dvy * 0.0001;
                        p.dvx *= FRICTION;
                        p.dvy *= FRICTION;

                        // 計算最終螢幕坐標（加上物理偏移後重算）
                        const fsx = sx + p.dvx * 0.3;
                        const fsy = sy + p.dvy * 0.3;

                        // 游標近似增亮係數
                        let boost = 1.0;
                        if (mouseActive) {
                            const ddx = fsx - rawMouseX;
                            const ddy = fsy - rawMouseY;
                            const dd  = Math.sqrt(ddx*ddx + ddy*ddy);
                            if (dd < REPEL_R) {
                                boost = 1.0 + (1.0 - dd / REPEL_R) * 1.8;
                            }
                        }

                        const r   = p.baseR * depth * (0.85 + 0.25 * Math.sin(t * p.speed + p.phase)) * Math.min(boost, 2.0);
                        const col = lerpColor(p.landColor, p.oceanColor, scrollProgress);
                        const a   = Math.min(1, p.alpha * depth * boost);

                        // 外層發光暈
                        const glowR = r * (3.0 + boost * 1.5);
                        const glow = ctx.createRadialGradient(fsx, fsy, 0, fsx, fsy, glowR);
                        glow.addColorStop(0,   `rgba(${col[0]},${col[1]},${col[2]},${Math.min(1, a)})`);
                        glow.addColorStop(0.35,`rgba(${col[0]},${col[1]},${col[2]},${a * 0.3})`);
                        glow.addColorStop(1,   `rgba(${col[0]},${col[1]},${col[2]},0)`);
                        ctx.beginPath();
                        ctx.arc(fsx, fsy, glowR, 0, Math.PI * 2);
                        ctx.fillStyle = glow;
                        ctx.fill();

                        // 亮核心
                        ctx.beginPath();
                        ctx.arc(fsx, fsy, r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${Math.min(1, a * 1.6)})`;
                        ctx.fill();
                    }

                    // ── 游標連線（靠近游標的粒子之間繪製能量線）──
                    if (mouseActive && nearCursor.length > 1) {
                        nearCursor.sort((a, b) => a.dist - b.dist);
                        const top = nearCursor.slice(0, 6);
                        for (let i = 0; i < top.length; i++) {
                            const pa = top[i];
                            // 粒子 → 游標連線
                            const lineA = 0.25 * (1 - pa.dist / (REPEL_R * 1.5));
                            ctx.beginPath();
                            ctx.moveTo(pa.sx, pa.sy);
                            ctx.lineTo(rawMouseX, rawMouseY);
                            ctx.strokeStyle = `rgba(${pa.col[0]},${pa.col[1]},${pa.col[2]},${lineA})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();

                            // 粒子之間連線
                            for (let j = i + 1; j < top.length; j++) {
                                const pb = top[j];
                                const ddx = pa.sx - pb.sx, ddy = pa.sy - pb.sy;
                                const d2 = Math.sqrt(ddx*ddx + ddy*ddy);
                                if (d2 < 120) {
                                    const lineA2 = 0.15 * (1 - d2 / 120);
                                    ctx.beginPath();
                                    ctx.moveTo(pa.sx, pa.sy);
                                    ctx.lineTo(pb.sx, pb.sy);
                                    ctx.strokeStyle = `rgba(${pa.col[0]},${pa.col[1]},${pa.col[2]},${lineA2})`;
                                    ctx.lineWidth = 0.4;
                                    ctx.stroke();
                                }
                            }
                        }
                    }
                }
                requestAnimationFrame(tick);

            } catch (e) {
                console.error('Particle init failed:', e);
            }

            // --- 海洋滾動切換邏輯 ---
            const oceanOverlay  = document.getElementById('oceanOverlay');
            const coverEnterBtn = document.getElementById('cover-enter-btn');
            let startY          = 0;

            function updateOceanState() {
                scrollProgress = Math.max(0, Math.min(1, scrollProgress));
                oceanOverlay.style.opacity = scrollProgress;

                const isEn = typeof currentLang !== 'undefined' && currentLang === 'en';

                if (scrollProgress > 0.5) {
                    coverEnterBtn.style.borderColor   = 'rgba(34,211,238,0.5)';
                    coverEnterBtn.style.color         = '#cffafe';
                    coverEnterBtn.textContent         = isEn ? 'Sail Out to Sea' : '揚帆出海航行';
                } else {
                    coverEnterBtn.style.borderColor   = 'rgba(253,230,138,0.4)';
                    coverEnterBtn.style.color         = '#fef3c7';
                    coverEnterBtn.textContent         = isEn ? 'Enter Mountain Forest' : '進入山林採集';
                }
            }

            window.addEventListener('wheel', (e) => {
                scrollProgress += e.deltaY * 0.0015;
                updateOceanState();
            });

            window.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
            window.addEventListener('touchmove', e => {
                scrollProgress += (startY - e.touches[0].clientY) * 0.003;
                startY = e.touches[0].clientY;
                updateOceanState();
            }, { passive: true });

            // --- 封面文字 Blur 動態載入效果 (相容 React 版 BlurText 機制) ---
            function applyBlurText(elementId, options = {}) {
                const el = document.getElementById(elementId);
                if (!el) return;
                
                const text = el.textContent.trim();
                el.textContent = ''; // 清空原本內容
                el.classList.remove('opacity-0'); // 移除隱藏 class
                el.style.display = 'flex';
                el.style.flexWrap = 'wrap';
                el.style.justifyContent = 'center';
                
                const animateBy = options.animateBy || 'chars';
                const direction = options.direction || 'top';
                const delay = options.delay || 40;
                const baseDelay = options.baseDelay || 0;
                
                const segments = animateBy === 'words' ? text.split(/\s+/) : text.split('');
                
                segments.forEach((seg, idx) => {
                    const span = document.createElement('span');
                    span.className = 'inline-block will-change-[transform,filter,opacity]';
                    span.style.opacity = '0';
                    
                    if (seg === ' ') {
                        span.innerHTML = '&nbsp;';
                    } else {
                        span.textContent = seg;
                    }
                    
                    if (animateBy === 'words' && idx < segments.length - 1) {
                        span.innerHTML += '&nbsp;';
                    }
                    
                    span.style.animationName = direction === 'top' ? 'blurTextFromTop' : 'blurTextFromBottom';
                    span.style.animationDuration = '0.7s';
                    span.style.animationTimingFunction = 'cubic-bezier(0.25, 1, 0.5, 1)';
                    span.style.animationFillMode = 'forwards';
                    span.style.animationDelay = `${(baseDelay + idx * delay) / 1000}s`;
                    
                    el.appendChild(span);
                });
            }

            // 執行文字分割與模糊動態進入
            applyBlurText('cover-subtitle', { direction: 'top', baseDelay: 400, delay: 50 });
            applyBlurText('cover-title-en', { direction: 'bottom', baseDelay: 1200, delay: 90 });
            applyBlurText('cover-title-zh', { direction: 'bottom', baseDelay: 1800, delay: 70 });
            
            // 說明文字各行獨立進行文字分割動畫，以維持排版
            const descLines = document.querySelectorAll('.cover-desc-line');
            descLines.forEach((line, lineIdx) => {
                const lineId = `cover-desc-line-${lineIdx}`;
                line.id = lineId;
                applyBlurText(lineId, { direction: 'bottom', baseDelay: 2500 + lineIdx * 700, delay: 35 });
            });

            // ==========================================
            // --- 封面文字互動壓力特效 (TextPressure) ---
            // ==========================================
            const mouse = { x: 0, y: 0 };
            const cursor = { x: 0, y: 0 };
            let pressureInitialized = false;

            function initPressureEvents() {
                if (pressureInitialized) return;
                pressureInitialized = true;

                window.addEventListener('mousemove', e => {
                    cursor.x = e.clientX;
                    cursor.y = e.clientY;
                });
                window.addEventListener('touchmove', e => {
                    const t = e.touches[0];
                    cursor.x = t.clientX;
                    cursor.y = t.clientY;
                }, { passive: true });

                // 初始化滑鼠感應起點為螢幕中心
                mouse.x = window.innerWidth / 2;
                mouse.y = window.innerHeight / 2;
                cursor.x = mouse.x;
                cursor.y = mouse.y;

                requestAnimationFrame(animatePressure);
            }

            const dist = (a, b) => {
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                return Math.sqrt(dx * dx + dy * dy);
            };

            const getAttr = (distance, maxDist, minVal, maxVal) => {
                // 距離越近，越往最大值 (maxVal) 靠攏
                const val = maxVal - Math.abs((maxVal * distance) / maxDist);
                return Math.max(minVal, val + minVal);
            };

            function animatePressure() {
                // 透過緩動阻尼 (Damping / Lerp) 提供優雅的物理滯後感
                mouse.x += (cursor.x - mouse.x) / 12;
                mouse.y += (cursor.y - mouse.y) / 12;

                // 1. 處理英文標題 "AVAKA" (Compressa VF: 支援 wght, wdth, ital)
                const titleEn = document.getElementById('cover-title-en');
                if (titleEn) {
                    const spans = titleEn.querySelectorAll('span');
                    if (spans.length > 0) {
                        const rect = titleEn.getBoundingClientRect();
                        const maxDist = Math.max(rect.width / 2, 250);

                        spans.forEach(span => {
                            const spanRect = span.getBoundingClientRect();
                            const charCenter = {
                                x: spanRect.left + spanRect.width / 2,
                                y: spanRect.top + spanRect.height / 2
                            };

                            const d = dist(mouse, charCenter);

                            // wght 範圍 700~900 (預設粗體), wdth 範圍 20~200, ital 範圍 0~1
                            const wght = Math.floor(getAttr(d, maxDist, 700, 200));
                            const wdth = Math.floor(getAttr(d, maxDist, 20, 180));
                            const ital = getAttr(d, maxDist, 0, 1).toFixed(2);

                            span.style.fontVariationSettings = `'wght' ${wght}, 'wdth' ${wdth}, 'ital' ${ital}`;
                        });
                    }
                }

                // 2. 處理中文標題 "島嶼的維度" (Noto Serif TC: 僅支援 wght)
                const titleZh = document.getElementById('cover-title-zh');
                if (titleZh) {
                    const spans = titleZh.querySelectorAll('span');
                    if (spans.length > 0) {
                        const rect = titleZh.getBoundingClientRect();
                        const maxDist = Math.max(rect.width / 2, 250);

                        spans.forEach(span => {
                            const spanRect = span.getBoundingClientRect();
                            const charCenter = {
                                x: spanRect.left + spanRect.width / 2,
                                y: spanRect.top + spanRect.height / 2
                            };

                            const d = dist(mouse, charCenter);

                            // Noto Serif TC Variable wght 規格為 300~900
                            const wght = Math.floor(getAttr(d, maxDist, 300, 600));

                            span.style.fontVariationSettings = `'wght' ${wght}`;
                        });
                    }
                }

                requestAnimationFrame(animatePressure);
            }

            // 啟動感應
            initPressureEvents();
        })();
    </script>

    <!-- ===================================================
         各頁面動態載入（Lazy Load）系統
    ==================================================== -->
    <script>
        // 頁面 ID → 對應的原始 HTML 檔案名稱
        const PAGE_FILES = {
            rulebook:  '規則書.html',
            scenario:  '情境腳本.html',
            fieldwork: '走讀.html',
            classroom: '課堂.html',
        };

        // 執行從外部 HTML 注入的 <script> 標籤（innerHTML 不會自動執行）
        // 已在 index.html head 預載的函式庫 src 清單（跳過重複載入）
        const PRELOADED_SRCS = ['react', 'react-dom', 'babel', 'lucide', 'tailwindcss', 'gradual-blur'];
        window.loadedDynamicScripts = window.loadedDynamicScripts || new Set(PRELOADED_SRCS);

        async function runInjectedScripts(container) {
            const scripts = Array.from(container.querySelectorAll('script'));

            for (const oldScript of scripts) {
                const scriptType = oldScript.getAttribute('type') || '';
                const src = oldScript.getAttribute('src') || '';

                if (src) {
                    // 外部腳本：若已預載則直接移除，否則非同步載入並等待
                    const isPreloaded = Array.from(window.loadedDynamicScripts).some(lib => src.includes(lib));
                    if (isPreloaded) {
                        oldScript.remove();
                        continue;
                    }
                    window.loadedDynamicScripts.add(src);
                    await new Promise(resolve => {
                        const newScript = document.createElement('script');
                        newScript.src = src;
                        Array.from(oldScript.attributes).forEach(attr => {
                            if (attr.name !== 'src') newScript.setAttribute(attr.name, attr.value);
                        });
                        newScript.onload  = resolve;
                        newScript.onerror = resolve; // 出錯也繼續
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                } else if (scriptType === 'text/babel') {
                    // Babel/React 腳本：手動轉譯（先讓瀏覽器渲染載入畫面，避免畫面卡死）
        await new Promise(resolve => setTimeout(resolve, 50));
                    try {
                        let code = oldScript.textContent;
                        // Wrap the script in an IIFE so variables like 'const root' and 'const [activeTab...' are scoped locally.
                        // This prevents SyntaxError (Identifier has already been declared) when navigating SPA pages back and forth.
                        code = `(() => { ${code} })();`;
                        const transpiled = Babel.transform(code, {
                            presets: ['react'],
                        }).code;
                        const newScript = document.createElement('script');
                        newScript.textContent = transpiled;
                        document.body.appendChild(newScript);
                        oldScript.remove();
                    } catch(e) {
                        console.error('❌ Babel 轉譯失敗：', e);
                    }

                } else {
                    // 一般 inline script
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    let code = oldScript.textContent;
                    const declRegex = /(?:^|;|}|{|\s)(const|let)\s+([a-zA-Z0-9_$]+)\b/g;
                    code = code.replace(declRegex, (fullMatch, keyword, varName) => {
                        return fullMatch.replace(keyword, 'var');
                    });
                    newScript.textContent = code;
                    document.body.appendChild(newScript);
                    oldScript.remove();
                }
            }
        }

        // 從原始 HTML 檔案中萃取 <head> 的 style 與 <body> 的內容和屬性
        function extractBody(htmlText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            // 萃取 <head> 中的所有 <style> 標籤，注入到 body 最前面
            let headStyles = '';
            doc.querySelectorAll('head style').forEach(s => {
                headStyles += `<style>${s.textContent}</style>`;
            });

            // 移除舊的全域導覽列（fixed top-0 z-[100] 樣式的 div）
            const oldNav = doc.querySelector('#global-nav');
            if (oldNav) oldNav.remove();
            // 用 class 特徵再清一次（情境腳本裡的舊導覽）
            doc.querySelectorAll('div').forEach(div => {
                const cls = div.className || '';
                if (cls.includes('fixed') && cls.includes('top-0') && cls.includes('z-[100]')) {
                    div.remove();
                }
            });

            // 移除規則書自帶的 beams-container 與動畫腳本，因為 SPA 內有全域優化版本
            const inlineBeams = doc.querySelector('#beams-container');
            if (inlineBeams) inlineBeams.remove();
            
            doc.querySelectorAll('script').forEach(scr => {
                const text = scr.textContent || '';
                const src = scr.getAttribute('src') || '';
                if (text.includes('AVAKA_BEAMS_STANDALONE_ONLY') || src.includes('three.min.js') || text.includes('three.module.js')) {
                    scr.remove();
                }
            });

            const bodyHTML = doc.body ? doc.body.innerHTML : htmlText;
            const bodyClass = doc.body ? doc.body.className : '';
            return {
                html: headStyles + bodyHTML,
                bodyClass: bodyClass
            };
        }

        async function initPage(pageId) {
            const section = document.getElementById('page-' + pageId);
            const filename = PAGE_FILES[pageId];
            if (!filename || !section) return;

            // ★ 卸載/載入新分頁前，徹底清理上一個分頁在 window 註冊的所有全域事件監聽器，消除卡死/殘留
            if (typeof window.stopTrackingAndCleanupSpaListeners === 'function') {
                window.stopTrackingAndCleanupSpaListeners();
            }

            // 顯示載入動畫
            section.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                     height:100vh;background:#01120d;color:#34d399;font-family:'Noto Serif TC',serif;">
                    <div style="width:44px;height:44px;border:3px solid rgba(52,211,153,0.2);
                         border-top-color:#34d399;border-radius:50%;
                         animation:_spin 1s linear infinite;margin-bottom:20px;">
                    </div>
                    <style>@keyframes _spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
                    <p style="letter-spacing:0.25em;font-size:0.9rem;opacity:0.8;">${filename.replace('.html','')} 載入中...</p>
                </div>`;

            try {
                const res = await fetch('./' + encodeURIComponent(filename));
                if (!res.ok) throw new Error('HTTP ' + res.status);
                let html = await res.text();

                // ★ 源頭字串級翻譯：若當前為英文模式，在 HTML 原始碼被瀏覽器解析前，直接用 RegExp 替換所有中文
                // 這能將 React 代碼、JS 靜態陣列、動態腳本的文字「預翻譯」，徹底避開 React 虛擬 DOM 衝突與當機！
                if (typeof currentLang !== 'undefined' && currentLang === 'en') {
                    html = html.replace(ZH_REGEXP, (match) => GLOSSARY[match] || match);
                }

                // 注入 body 內容與其樣式類別（並去除舊導覽列）
                const extracted = extractBody(html);
                section.innerHTML = extracted.html;
                if (extracted.bodyClass) {
                    const classesToAdd = extracted.bodyClass.split(/\s+/).filter(Boolean);
                    classesToAdd.forEach(cls => {
                        section.classList.add(cls);
                    });
                }

                // 補上該頁面需要的 padding-top 以避免被全域導覽列遮住
                section.style.paddingTop = '60px';

                // ★ 開始追蹤這個分頁腳本在 window 註冊的新事件監聽器，以便之後自動清理
                if (typeof window.startTrackingSpaListeners === 'function') {
                    window.startTrackingSpaListeners();
                }

                // 執行頁面內的 script（非同步依序，Babel 轉譯完成後才繼續）
                await runInjectedScripts(section);

                // ★ 腳本執行後，再清除一次殘留的舊導覽列（JS 動態生成的無法預先過濾）
                // 延遲 300ms 確保情境腳本的 appContainer.innerHTML 已執行完畢
                setTimeout(() => {
                    section.querySelectorAll('div, nav').forEach(el => {
                        const cls = el.className || '';
                        const hasBg = cls.includes('bg-[#010a08]') || cls.includes('bg-\\[#010a08\\]');
                        const hasNav = el.querySelector('a[href*=".html"]');
                        if (hasBg && hasNav) el.remove();
                    });
                    // 也移除含有舊連結的 fixed nav div
                    section.querySelectorAll('[class*="border-emerald-900/50"][class*="justify-center"]').forEach(el => {
                        if (el.querySelector('a[href*="封面.html"], a[href*="規則書.html"]')) el.remove();
                    });
                    if (window.lucide) lucide.createIcons();
                }, 300);

                console.log(`✅ ${filename} 載入完成`);
            } catch (err) {
                section.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
                    height:60vh;color:#f87171;font-size:1rem;letter-spacing:0.2em;">
                    ⚠ 載入失敗：${err.message}<br><small style="opacity:0.6;margin-top:8px;display:block;">
                    請確認在本機伺服器環境下開啟（非直接用瀏覽器開啟檔案）</small></div>`;
                console.error(`❌ 載入 ${filename} 失敗：`, err);
            }
        }
    </script>

            "每張工序卡採雙面設計，體現「內核傳統、外殼現代」的核心主題：": "Each process card adopts a double-sided design, embodying the core theme of ‘Traditional Core, Modern Shell’:",
            "工匠動作手繪插圖，附族語動詞（如：Mivivini 捻線）。角落標註所需 AP 與 KP。傳遞具身實踐與默會知識。": "Hand-drawn illustrations of artisan actions with Tao verbs (e.g. Mivivini twining rope). AP and KP requirements are marked in the corners. Transmits embodied practice and tacit knowledge.",
            "SEM 掃描顯微影像，顯示 Avaka 吸水膨脹率 15% vs 尼龍 0%，將原住民生態知識轉譯為科學數據，驗證祖先工藝的物理優勢。": "SEM scanning electron microscope images showing Avaka’s water-absorption expansion rate is 15% vs nylon’s 0%, translating indigenous ecological knowledge into scientific data to verify the physical advantages of ancestral craftsmanship.",
            "所有玩家共用一個底線目標：在第 12 回合結束前完成自己的拼板舟。未能完工者視為「文化斷裂」，直接出局。": "All players share a baseline goal: complete their own plank boat before the end of the 12th round. Those who fail to finish are deemed ‘Cultural Disruption’ and are eliminated directly.",
            "在此基礎上，文化韌性評分最高的玩家獲勝。評分取決於你選擇哪條完工路徑、如何積累技術知識，以及你與耆老、青年之間的傳承互動。": "On this basis, the player with the highest Cultural Resilience Score wins. The score depends on which completion path you choose, how you accumulate technical knowledge, and your heritage interaction with Elders and Youth.",
            "遊戲中有兩種核心點數，每位玩家需同時追蹤：": "There are two core points in the game, which each player must track simultaneously:",
            "每位玩家於遊戲開始前選擇一個角色，角色決定你的 AP 上限、初始 KP，以及獨特能力。": "Each player selects a character before the game starts. The character determines your AP limit, initial KP, and unique ability.",
            "地圖為線性設計，玩家只能依序在三個區域間移動。每跨越一格消耗 1 AP（青年角色為 0 AP）。": "The map is linear, and players can only move sequentially among three areas. Crossing each tile consumes 1 AP (0 AP for the Youth character).",
            "同區域的玩家可消耗 1 AP 將材料贈予另一名玩家": "Players in the same area can consume 1 AP to gift materials to another player.",
            "本腳本為《Avaka：島嶼的維度》沉浸式走讀工作坊的完整帶路人手冊，涵蓋開場引言、各空間站點情境台詞、操作介入時機，以及最終反思討論的引導。": "This script is a complete guide manual for the immersive Ponso no Tao fieldwork workshop, covering opening introductions, situational dialogues at various space stations, timing for operational intervention, and final reflective discussions.",
            "全程以 3–4 小時為設計基準，本版腳本的邏輯前提是「空間先於規則」——玩家的身體位置決定其可執行的行動。": "Designed with a baseline of 3-4 hours. The logical premise of this script is 'Space precedes Rules' — the player's physical location determines their available actions.",
            "工作坊視覺化操作流程": "Fieldwork Workshop Visualized Flowchart",
            "設計核心原則": "Core Design Principles",
            "空間即規則。帶路人不會宣布「你不能這樣做」，透過讓環境說話——「這裡沒有 Avaka，你要去哪裡採集？」": "Space is rule. The guide will not announce 'You cannot do this'. Instead, let the environment speak — 'There is no Avaka here, where will you gather?'",
            "身體先於詮釋。讓玩家先觸摸、先移動、先行動，再給予知識框架解釋其意義。": "Body before interpretation. Let players touch, move, and act first, before providing a knowledge framework to explain the meaning.",
            "失敗也是完整的體驗。未完工的玩家不需要補救，其結局文本是整個工作坊中最有討論價值的材料之一。": "Failure is also a complete experience. Unfinished players do not need rescue; their ending narrative is one of the most valuable materials for discussion in the workshop.",
            "帶路人保持角色扮演。帶路人在各空間站點以「現場工匠」或「部落耆老」身份說話，而非遊戲設計者。": "Guide maintains role-play. The guide speaks at various stations as a 'local artisan' or 'tribal elder', rather than a game designer.",
            "「你們現在站的這個地方，有人曾在這裡造船，在這裡等待季節，在這裡失去技術，也有人在這裡把知識傳給下一代。」": "“The place where you stand now is where people once built boats, waited for seasons, lost techniques, and passed knowledge to the next generation.”",
            "「今天，我們要跟著這片土地的節奏走一遍。我不會告訴你們應該怎麼做。但可以告訴你們的是，這個地方，它有很多故事。準備好踏入這段旅程吧。」": "“Today, we will walk along the rhythm of this land. I will not tell you what you should do. But what I can tell you is that this place holds many stories. Get ready to step into this journey.”",
            "「手上這張牌，是你今天在這個地方的身份。你不能交換，不能選擇。（停頓）在蘭嶼的傳統社會，沒有人選擇自己的出身，但每一個位置都有它的責任與意義。翻開它，認識你自己。」": "“This card in your hand is your identity here today. You cannot exchange it, you cannot choose it. (Pause) In Lanyu’s traditional society, no one chooses their birth, but every position has its responsibility and meaning. Flip it over, and know yourself.”",
            "你是今天走讀中知識的「源頭」。你不主動教學，只在被問到的時候才說話。": "You are the ‘source’ of knowledge in today’s fieldwork. You do not actively teach; you only speak when asked.",
            "移動力最強(不耗AP)，但現在什麼都不會(KP 0)。唯一可觸摸所有材料的角色。": "Most mobile (0 AP for movement), but currently knows nothing (KP 0). The only character who can touch all materials.",
            "最複雜的角色。有基礎知識(KP 5)，特殊能力讓你使用工業材料時不受懲罰。": "The most complex character. Has basic knowledge (KP 5), with a special ability that exempts you from penalties when using industrial materials.",
            "「你擁有最多的技術知識，但體力有限。你的存在意義，不是完成速度最快的船，而是確保知識不在你這一代斷掉。你的聲望，來自於你教會了多少人。」": "“You possess the most technical knowledge, but physical energy is limited. Your reason for being is not to finish the fastest boat, but to ensure that knowledge does not break in your generation. Your prestige comes from how many people you have taught.”",
            "「你移動不耗體力，學習能力最強，但你現在什麼都不會——KP 是零。你能走到哪裡、能做什麼，很大程度上取決於你願不願意跟著耆老。沒有人會強迫你，但知識只在靠近的地方發生。」": "“You move without wasting physical energy, and your learning ability is the strongest, but you currently know nothing — KP is zero. Where you can go and what you can do depends largely on your willingness to follow the elder. No one will force you, but knowledge only happens in close proximity.”",
            "「你是橋樑，也是矛盾最深的人。你用工業材料不會被懲罰，但你也清楚，這條路走到底，船造好了，技術也死了。你有能力在現實與傳統之間找到縫隙——問題是你想不想找。」": "“You are a bridge, and also the person with the deepest contradictions. You will not be penalized for using industrial materials, but you also know that if you go all the way down this path, the boat is built and the technology is dead. You have the ability to find cracks between reality and tradition — the question is whether you want to look for them.”",
            "「做船不能只看地上的麻，要看天上的雲。快收起來！」": "“Building a boat is not just about looking at the hemp on the ground, but reading the clouds in the sky. Hurry, pack them up!”",
            "此時，便利的「化學樹脂」在商店發出誘人的光芒——它不怕濕，且即刻可用。": "At this moment, the convenient ‘chemical resin’ glows invitingly in the shop window — it is unaffected by moisture and instantly usable.",
            "「這就是『儀式時間』的邏輯。你得學會等待。如果你現在強行完工，這艘船在部落眼中將失去靈魂。」": "“This is the logic of ‘Ritual Time’. You must learn to wait. If you force completion now, this boat will lose its soul in the eyes of the tribe.”",
            "「但我只剩兩個月就要結算了！如果不現在做，我怕來不及完成……」": "“But I only have two months left until the settlement! If I don't do it now, I'm afraid it'll be too late...”",
            "「你現在可以去學你還沒學到的東西。等待，不是什麼都不做。」": "“You can use this time to learn what you haven't learned yet. Waiting is not doing nothing.”",
            "「看吧，只要你順應時序，土地會給你最後的補償。快動手，讓這條船趕在明年飛魚祭前下水！」": "“See? As long as you conform to the seasonal flow, the land will give you final compensation. Move quickly, get this boat in the water before next year’s Flying Fish Festival!”",
            "「糟了！我的 Avaka 原料用完了，但現在上山會觸犯禁忌……」": "“Oh no! My Avaka raw materials are depleted, but going to the mountains now would violate the taboo...”",
            "「這就是為什麼老人家說 Kashyman 月要拼命存貨。現在你只能跟我去商店買尼龍繩，或者枯等一個月，看著進度落後。」": "“This is why the elders said to stock up eagerly during Kashyman. Now you can only buy nylon rope with me at the shop, or wait dryly for a month and watch your progress fall behind.”",

            // --- Dynamic scenario & ending translations ---
            "第 2 月 Kapowan (Paneneb)": "Month 2: Kapowan (Paneneb)",
            "第 5 月 Pipilapila": "Month 5: Pipilapila",
            "第 10 月 Kaneman": "Month 10: Kaneman",
            "第 12 月 Kaowan": "Month 12: Kaowan",
            "青年": "Youth",
            "中生代": "Negotiator",
            "系統": "System",
            "【飛魚禁令】禁止進入山林，無法執行「採集」動作。": "【Flying Fish Ban】Entering the mountain forest is prohibited; the ‘Gather’ action cannot be executed.",
            "部落灘頭已舉行招魚祭，整個月門戶關閉（Paneneb）。為了尊重魚靈，所有男人禁止進入山林。": "The Rayon (招魚祭) has been held at the beach, and the gate is closed for the entire month (Paneneb). To show respect to the fish spirits, all men are prohibited from entering the mountain forest.",
            "玩家必須決定是要「消耗 1 AP 贈與」向隊友求援，還是直接轉向「路徑 B：商店購買」以換取進度。": "Players must decide whether to ‘Consume 1 AP to Gift’ to request help from teammates, or turn directly to ‘Path B: Store Purchase’ to trade for progress.",
            "【梅雨季節】若未預留 AP 處理，曝曬中的材料將自動報廢。": "【Plum Rain Season】If no AP is reserved for maintenance, the materials drying in the sun will rot and be scrapped automatically.",
            "天空陰雲密佈，突如其來的降雨讓你在灘頭曝曬的 Avaka 纖維陷入腐爛危機。": "The sky is overcast with thick clouds, and sudden rain threatens to rot the Avaka fibers drying on the beach.",
            "「孩子，做船不能只看地上的麻，要看天上的雲。快收起來！」": "“Child, building a boat is not just about looking at the hemp on the ground, but reading the clouds in the sky. Hand them in!”",
            "玩家必須額外支出 1 AP 進行材料維護。若 AP 已耗盡，苦心經營的「路徑 A」材料將歸零。": "Players must spend an extra 1 AP for material maintenance. If AP is depleted, the hard-earned ‘Path A’ materials will be lost and reduced to zero.",
            "【禁忌之月】最不吉祥的月份，無法執行任何「完工（填縫）」動作。": "【Forbidden Month】The most inauspicious month; executing any ‘Caulking (Finishing Ship)’ action is strictly prohibited.",
            "這是專門製作貝灰的月份，不允許舉行婚禮、造屋或落成禮。即便你的材料已齊備，現在也絕不能動工填縫。": "This is a month dedicated to making shell ash, and no weddings, house building, or completion ceremonies are allowed. Even if all your materials are ready, you must not start caulking now.",
            "此情境強迫玩家轉向「請益」以累積 KP。這體現了技術實踐是維繫人、物與神靈平衡的社會倫理，而非單純追求生產效率。": "This scenario forces players to turn to ‘Consultation’ to accumulate KP. It reflects that technical practice is a social ethic for maintaining the balance between humans, objects, and spirits, rather than purely pursuing production efficiency.",
            "【技術精進】執行「捻線」不再消耗 AP。": "【Tech Master】Executing the ‘Twining Rope’ action no longer consumes AP.",
            "這是屬於手工藝的月份。雖然時間緊迫，但你發現自己的手感前所未有的流暢。": "This is a month dedicated to handicrafts. Although time is pressing, you find your hands flowing with unprecedented smoothness.",
            "讓堅持「路徑 A」的玩家在最後一刻獲得加速感，平衡路徑 B 的便利性誘惑。": "Gives players sticking to ‘Path A’ a sense of acceleration at the final moment, balancing the tempting convenience of Path B.",
            "完成「路徑 A：Avaka 操作鏈」、觸發「科學轉譯」、且與耆老有高度傳承互動（累積聲望分）。": "Completed ‘Path A: Avaka Crafting Chain’, triggered ‘Scientific Translation’, and had high-frequency heritage interactions with the Elder (accumulating Reputation Points).",
            "「這艘船是活的。不僅僅一種比喻，而是真的活著。你花了整整一年，跟著走過祖先的同一條山路，身體記住了採集時該繞開哪棵樹、Avaka的纖維要朝哪個方向捻才不會斷。這些動作可能沒有被文字記錄，卻藏在族人身體的記憶之中，等待被喚醒。": "“This boat is alive. It is not just a metaphor, but truly alive. You spent a whole year retracing the exact same mountain path of your ancestors. Your body remembers which tree to bypass when gathering, and which direction to twine the Avaka fibers so they won't break. These actions might not be recorded in text, but they are hidden in the physical memory of the tribe, waiting to be awakened.",
            "後來，透過科學資料，證實了Avaka 纖維吸水之後會膨脹。你忽然明白，老人說『讓船呼吸』不只一種想像，是造船的學問。當海水滲進縫隙，纖維膨脹後，船反而變得更緊實。可以拆，可以修，可以一塊一塊換掉，再一次出海。": "“Later, scientific data confirmed that Avaka fibers expand after absorbing water. You suddenly realized that when the elders said ‘let the boat breathe,’ it was not just an imagination, but a profound knowledge of boat building. When sea water seeps into the cracks and the fibers expand, the boat becomes tighter instead. It can be disassembled, repaired, and replaced piece by piece, to set sail again.",
            "那些你以為早已斷裂的記憶，其實只是靜靜地等著願意承接的人。": "“Those memories you thought were long broken are actually just waiting quietly for someone willing to inherit them.",
            "而這艘船會繼續航行，帶著耆老們說過的話，也帶著你找回的那些記憶。」": "“And this boat will continue to sail, carrying the words spoken by the elders, and the memories you have recovered.”",
            "多由「中生代工匠」達成，混用部分工業材料，但保留核心傳承邏輯。": "Mostly achieved by the ‘Negotiator (Middle-aged Artisan)’, mixing some industrial materials but retaining the core heritage logic.",
            "「你沒辦法只活在傳統裡，這你很清楚。": "“You cannot live solely in tradition, that much you know clearly.",
            "孩子要上學，油費要繳，時間不等人，你在這些現實壓力裡嘗試找到縫隙，幾塊工業材料省了些工夫，但你沒有就此撒手。你還是去敲了耆老的門，還是問了那幾個不問不會有人主動說的問題：材料要怎麼選、哪道工序不能跳過，有甚麼樣的禁忌。": "“Children need school, fuel needs to be paid for, and time waits for no one. Amidst these real-life pressures, you tried to find cracks. A few industrial materials saved some effort, but you did not let go entirely. You still knocked on the elder’s door, still asked those few questions that no one would answer unless asked: how to choose materials, which process cannot be skipped, and what taboos exist.",
            "船造好的時候，你自己也說不清它到底是傳統還是現代。但或許這才是最誠實的答案，蘭嶼從來就不是一座博物館，人們在這裡過的是真實的生活，傳統也一直在真實的生活裡摩擦、磨損、又重新長出新的樣子。": "“When the boat was finished, you couldn't tell if it was traditional or modern. But perhaps that is the most honest answer. Lanyu has never been a museum; people live real lives here, and tradition is always rubbing, wearing down, and growing into new shapes in real life.",
            "這艘船帶著工業的氣味，也帶著老人家的智慧。它雖不完美，但它是活在這個時代裡的人造出來的。」": "“This boat carries the scent of industry, and also the wisdom of the elders. It is not perfect, but it was built by people living in this very era.”",
            "完成「路徑 B：工業替代模式」，雖完工但缺乏文化加成。": "Completed ‘Path B: Industrial Substitution Mode’; although finished, it lacks cultural resilience bonuses.",
            "「船造好了。但有什麼東西卻悄然失去了。": "“The boat is finished. But something has been quietly lost.",
            "南寶樹脂把縫填得密不透風，不用等木材慢慢漲開，不用對著日曆算季節，省下了大半時間。船下水的那一刻，看起來和其他船沒什麼兩樣。": "“The epoxy resin sealed the gaps airtight. No waiting for the wood to slowly swell, no checking the calendar for seasons, saving most of the time. The moment the boat entered the water, it looked no different from any other boat.",
            "只是壞了就壞了，沒辦法修。那種嵌接的方式、那種拆開再組回去的可能，在你選擇跳過的那幾道工序裡，也連帶消失了。": "“But once it breaks, it breaks, and there is no way to repair it. That method of interlocking, the possibility of taking it apart and putting it back together, disappeared along with the few processes you chose to skip.",
            "手指也忘了。忘了纖維來回時的阻力，忘了怎麼判斷木材的品種。隨然並非一夕之間，卻是一點一點地，在每個選擇便利的瞬間流失。": "“Your fingers have forgotten too. Forgotten the resistance when the fibers move back and forth, forgotten how to identify wood species. Although not overnight, it slipped away little by little, in every moment you chose convenience.",
            "這艘船能用，但卻沒辦法教會你任何事。它只是一件時代下的商品。」": "“This boat is usable, but it cannot teach you anything. It is merely a product of the times.”",
            "勉強完工，但全程未使用傳統材料，且無視季節禁忌或與耆老零互動。": "Barely finished, using no traditional materials throughout, ignoring seasonal taboos, and having zero interaction with the Elder.",
            "「船下水了。你應該覺得完成了什麼，但內心是空的。": "“The boat is in the water. You should feel that you have accomplished something, but your heart is empty.",
            "你沒有上山採集過那些Avaka，不知道採集時要說什麼、要避開哪些日子。你繞過了所有看起來麻煩的環節，也繞過了所有真正重要的事。": "“You have never climbed the mountain to gather Avaka, you don't know what to say during gathering, or which days to avoid. You bypassed all the links that seemed troublesome, and bypassed all the things that truly mattered.",
            "這艘船和這片海沒有關係，和山也沒有關係。它只是一個形狀，一件可以賣給觀光客拍照的道具。沒有人會想修它，壞了就丟，再做一艘新的。": "“This boat has nothing to do with the sea, and nothing to do with the mountain. It is just a shape, a prop to sell to tourists for photos. No one wants to repair it; if it breaks, throw it away and build a new one.",
            "那些採集時吟唱的歌，那些老人家說只有動手做才能理解的身體知識——不是被由你反對，是被你忽略了。被忽略的東西，比被摧毀的東西消失得更安靜，也更難追回。」": "“Those songs chanted during gathering, that physical knowledge the elders said can only be understood by doing it yourself — were not opposed by you, but ignored. Things ignored disappear more quietly than things destroyed, and are harder to recover.”",
            "未能在 12 回合（一年）內完成船隻。": "Failed to complete the boat within 12 rounds (one year).",
            "「一年過去了，灘頭的木材還散在那裡。": "“A year has passed, and the wood on the beach is still scattered there.",
            "始終沒有開始，好像哪裡卡住了，借使是不知道下一步該問誰，也許是繞了太多遠路，隨時間一天一天過去，而你還沒準備好。": "“It never started, as if stuck somewhere. Perhaps you didn't know who to ask for the next step, perhaps you took too many detours, and as time passed day by day, you were still not ready.",
            "一艘船的誕生需要一整年，不是因為工序真的那麼複雜，是因為它必須跟著季節走：採集、乾燥、等待、修整，每一步都有它自己的時間。你的節奏和這個節奏對不上，船就停在那裡，等一個不會來的時機。": "“The birth of a boat takes a whole year, not because the process is really that complex, but because it must follow the seasons: gathering, drying, waiting, trimming — every step has its own time. Your rhythm did not match this rhythm, and the boat stopped there, waiting for a time that would never come.",
            "那些纖維會腐爛。那些還沒說出口的技術知識，也會隨著保有記憶的人慢慢老去，而跟著消失。": "“Those fibers will rot. Those unspoken technical skills will also disappear as the people holding the memories slowly grow old.",

            "這艘船是活的。不僅僅是一種比喻，而是真的活著。你花了整整一年，跟著走過祖先的同一條山路，身體記住了採集時該繞開哪棵樹、Avaka 的纖維要朝哪個方向捻才不會斷。這些動作可能沒有被文字記錄，卻藏在族人身體的記憶之中，等待被喚醒": "This boat is alive. It is not just a metaphor, but truly alive. You spent a whole year retracing the exact same mountain path of your ancestors. Your body remembers which tree to bypass when gathering, and which direction to twine the Avaka fibers so they won’t break. These actions might not be recorded in text, but they are hidden in the physical memory of the tribe, waiting to be awakened",
            "後來，透過科學資料，證實了 Avaka 纖維吸水之後會膨脹。你忽然明白，老人說『讓船呼吸』不只一種想像，是造船的學問。當海水滲進縫隙，纖維膨脹後，船反而變得更緊實。可以拆，可以修，可以一塊一塊換掉，再一次出海": "Later, scientific data confirmed that Avaka fibers expand after absorbing water. You suddenly realized that when the elders said ‘let the boat breathe,’ it was not just an imagination, but a profound knowledge of boat building. When sea water seeps into the cracks and the fibers expand, the boat becomes tighter instead. It can be disassembled, repaired, and replaced piece by piece, to set sail again",
            "孩子要上學，油費要繳，時間不等人，你在這些現實壓力裡嘗試找到縫隙，幾塊工業材料省了些工夫，但你沒有就此撒手。你還是去敲了Elder的門，還是問了那幾個不問不會有人主動說的問題：材料要怎麼選、哪道工序不能跳過": "Children need school, fuel needs to be paid for, and time waits for no one. Amidst these real-life pressures, you tried to find cracks. A few industrial materials saved some effort, but you did not let go entirely. You still knocked on the Elder’s door, still asked those few questions that no one would answer unless asked: how to choose materials, and which process cannot be skipped",
            "主持人問全班：「你在現代生活中，有沒有一種等待是有意義的？還是所有的等待對你來說都只是浪費時間？」等待 2-3 位學生發言後繼續。這個問題不需要標準答案，目標是讓學生的生命經驗與遊戲機制產生對話": "Host asks the class: “In modern life, is there a kind of waiting that is meaningful? Or is all waiting just a waste of time for you?” Wait for 2-3 students to speak before continuing. This question does not require a standard answer; the goal is to create a dialogue between students’ life experiences and the game mechanisms",
            "課堂教學模式的完整主持人手冊，涵蓋開場引言、角色導入、各月份情境台詞、教學介入時機，以及最終反思討論的逐字引導。全程以 60 分鐘為設計基準，主持人可依課堂節奏作 10 分鐘內的彈性調整": "The complete host manual for classroom teaching mode, covering opening remarks, character introduction, situational dialogues for each month, timing for pedagogical intervention, and verbatim guides for final reflective discussions. Designed with a baseline of 60 minutes, which the host can flexibly adjust within a 10-minute margin based on classroom pacing",
            "傳統的路，需要等待季節、跟著Elder學習，每一步都有它的節奏。快的路，是去Store買化學樹脂，幾個動作就能Finish Ship。兩條路都能讓你造好一艘船，但這兩艘船是不一樣的": "The traditional path requires waiting for the seasons and learning from the Elder; every step has its own rhythm. The quick path is to go to the Store to buy chemical resin, finishing the ship with a few simple steps. Both paths can allow you to build a boat, but these two boats are fundamentally different",
            "這是蘭嶼夜曆中最不吉祥的月份。這個月，專門製作貝灰，不允許舉行婚禮、造屋，也不允許落成禮。 即便你的材料已齊備，KP 已達標——現在也絕對不能動工Caulking。」": "This is the most inauspicious month in Lanyu’s calendar. This month is dedicated to making shell ash, and no weddings, house building, or completion ceremonies are allowed. Even if your materials are ready and KP has met the threshold — you must never start caulking now.”",
            "但我要提醒你們一件事：下個月是 Kapowan，招魚祭的月份，Mountain Forest會封閉整整一個月。你現在手上的 Avaka 原料還夠嗎": "But I want to remind you of one thing: next month is Kapowan, the month of the fish-calling ritual, and the Mountain Forest will be closed for a whole month. Do you currently have enough Avaka raw materials in your hand?",
            "主持人問全班：「有哪一組選擇了枯坐一個月的？為什麼？」讓不同組分享決策邏輯。觀察課堂中「接受限制」與「繞過限制」的比例——這個比例本身就是教學素材": "Host asks the class: “Which group chose to sit dryly for a month? Why?” Let different groups share their decision-making logic. Observe the proportion of “accepting constraints” vs. “bypassing constraints” in the classroom — this ratio itself is a great teaching resource.",
            "說完後不要繼續解釋，給學生 30 秒的安靜決策時間。觀察哪些組的Youth開始快速往Mountain Forest移動採集，哪些組忽略了這個預警": "Do not explain further after speaking; give students 30 seconds of silent decision-making time. Observe which groups’ Youth begin to move quickly to the Mountain Forest to gather, and which groups ignore this pre-warning.",
            "讓這個Rounds跑完整。不要催促，讓各組自行完成最後行動與Finish Ship計算。主持人保持安靜，只在必要時回答規則問題。讓結局自然發生": "Let this round run completely. Do not rush; let each group finish their final actions and finish ship calculations. Host remains quiet, only answering rule questions when necessary. Let the endings happen naturally.",
            "你沒有上山採集過那些 Avaka，不知道採集時要說什麼、要避開哪些日子。你繞過了所有看起來麻煩的環節，也繞過了所有真正重要的事": "You have never climbed the mountain to gather Avaka, you don’t know what to say during gathering, or which days to avoid. You bypassed all the links that seemed troublesome, and bypassed all the things that truly mattered.",
            "你發現自己的手感前所未有的流暢。不是因為你突然變厲害了，是因為你整年都在積累，而現在，土地給了你最後的補償。」": "You find your hands flowing with unprecedented smoothness. Not because you suddenly became amazing, but because you have been accumulating all year, and now, the land has given you the final compensation.”",
            "始終沒有開始，好像哪裡卡住了，也許是不知道下一步該問誰，也許是繞了太多遠路，隨時間一天一天過去，而你還沒準備好": "It never started, as if stuck somewhere. Perhaps you didn’t know who to ask for the next step, perhaps you took too many detours, and as time passed day by day, you were still not ready.",
            "現在，Mountain Forest封閉，你無法執行採集行動。如果你上個月沒有存夠材料，你面臨三個選擇：」": "Now that the Mountain Forest is closed, you cannot execute gather actions. If you did not stockpile enough materials last month, you face three options:”",
            "預載畫面 (Preloader) - 提供即時回饋，避免 Babel 編譯與加載時的短暫黑屏卡頓感": "Preloader — provides instant feedback to avoid brief black screen lag during Babel compilation and loading",
            "透過Apprentice Mechanism，體驗「默會知識」的場域依賴性——知識需要在場才能傳遞": "Through the Apprentice Mechanism, experience the field-dependency of ‘tacit knowledge’ — knowledge must be present in the field to be transmitted.",
            "這句話不需特別強調，只是讓誘惑自然存在於遊戲場域中。接著繼續讓學生完成本Rounds行動，不做評論": "This sentence does not need special emphasis; just let the temptation naturally exist in the game space. Then let students complete their actions in this round without comment.",
            "那些採集時吟唱的歌，那些老人家說只有動手做才能理解的身體知識——不是被你反對，是被你忽略了。」": "Those songs chanted during gathering, that physical knowledge the elders said can only be understood by doing it yourself — were not opposed by you, but ignored.”",
            "讓學生從遊戲第一Rounds就進入「預判未來、提前規劃」的思維，模擬文化知識中的預備行為邏輯": "Allow students to enter an ‘anticipate the future and plan ahead’ mindset from the very first round, simulating preparatory behavior logic in cultural knowledge.",
            "教學提示：朗讀時不要搭配投影片Description。讓語言單獨產生作用，讓學生先感受情境": "Pedagogical Tip: Do not use slides during reading. Let the language speak for itself, and let students feel the context first.",
            "所有男人禁止進入Mountain Forest，門戶關閉——這叫做 Paneneb，是禁忌": "All men are forbidden from entering the Mountain Forest; the gateway is closed — this is called Paneneb, a taboo.",
            "這是最容易引發挫折感的月份。讓學生在「幾乎完成」的時刻被強制暫停，體驗「儀式時間」的邏輯": "This is the month most likely to cause frustration. Forcing students to pause at the ‘almost finished’ moment allows them to experience the logic of ‘Ritual Time’.",
            "這一年，你們必須完成一艘拼板舟。這艘船不只是交通工具，它是你們和祖先、和海洋之間的對話": "This year, you must complete a plank boat. This boat is not just a means of transport; it is a dialogue between you, your ancestors, and the ocean.",
            "在傳統社會裡，沒有人可以選擇自己的出身，你被賦予了一個位置，你就在那個位置上承擔責任": "In traditional society, no one can choose their own origin. You are given a position, and you bear responsibility in that position.",
            "規則說：曝曬中的材料，若你沒有預留 1 AP 進行維護，下Rounds自動報廢。」": "The rules say: for materials being dried, if you do not reserve 1 AP for maintenance, they will automatically rot next round.”",
            "引導學生思考為何「高分路徑」比「快速路徑」更難達成，並連結至現實中文化傳承的困境": "Guide students to reflect on why the ‘high-score path’ is harder to achieve than the ‘quick path’, linking it to real-life dilemmas of cultural heritage.",
            "天空陰雲密佈。 突如其來的降雨，讓你在灘頭曝曬的 Avaka 纖維陷入腐爛危機": "The sky is covered with dark clouds. The sudden rain puts your Avaka fiber drying on the beach in danger of rotting.",
            "讓學生透過角色扮演與決策體驗，深度理解「技術選擇與文化韌性」之間的邏輯關係": "Enable students to deeply understand the logical connection between ‘technical choices and cultural resilience’ through role-playing and decision-making experiences.",
            "飛魚隨著黑潮而來，而我們則順應時節。這是海洋的規矩，我們要好好遵守。」": "“Flying fish come with the Kuroshio current, and we conform to the seasons. This is the rule of the ocean, and we must obey it well.”",
            "這是屬於手工藝的月份。 男人冶鐵織繩，女人織布——整個部落都在做手工": "This is a month dedicated to handicrafts. Men forge iron and weave ropes, women weave cloth — the entire tribe is doing handcrafts.",
            "讓堅持傳統路徑的玩家在最後一刻獲得加速感，感受到「順應時序的回報」": "Allow players who stick to the traditional path to feel a sense of acceleration at the last moment, experiencing ‘the rewards of conforming to seasonal flow’.",
            "手上這張卡，是你在蘭嶼的身份。在你翻開它之前，我只想告訴你一件事": "This card in your hand is your identity in Lanyu. Before you flip it over, I only want to tell you one thing:",
            "每Rounds翻開一張月份卡，月份卡決定本Rounds的環境限制": "Each round flip a Month Card; the Month Card determines environmental constraints for the current round.",
            "但在這一年裡，你們會不斷面對一個問題：走傳統的路，還是走快的路": "But in this year, you will constantly face a question: take the traditional path, or the quick path.",

    <script>
        const router = (() => {
            // 頁面 ID → section element 的映射
            const pages = {
                cover:     document.getElementById('page-cover'),
                rulebook:  document.getElementById('page-rulebook'),
                scenario:  document.getElementById('page-scenario'),
                fieldwork: document.getElementById('page-fieldwork'),
                classroom: document.getElementById('page-classroom'),
            };

            const globalNav   = document.getElementById('global-nav');
            const navLinks    = { cover: document.getElementById('gnav-cover'), rulebook: document.getElementById('gnav-rulebook'), scenario: document.getElementById('gnav-scenario'), fieldwork: document.getElementById('gnav-fieldwork'), classroom: document.getElementById('gnav-classroom') };

            // 記錄哪些頁面已初始化（避免重複執行 init）
            const initialized = { cover: true };

            let currentPage = 'cover';

            function go(pageId) {
                if (!pages[pageId]) return;
                if (currentPage === pageId) return;

                // 隱藏當前頁
                const prev = pages[currentPage];
                prev.classList.remove('page-active');

                // 切換導覽列顯示邏輯
                if (pageId === 'cover') {
                    globalNav.style.display = 'none';
                    document.body.style.overflow = 'hidden';
                } else {
                    globalNav.style.display = 'flex';
                    document.body.style.overflow = '';
                    window.scrollTo(0, 0);
                }

                // 更新 nav active 狀態
                Object.values(navLinks).forEach(a => a && a.classList.remove('nav-current'));
                if (navLinks[pageId]) navLinks[pageId].classList.add('nav-current');

                // 顯示目標頁
                currentPage = pageId;
                const next = pages[pageId];
                next.classList.add('page-active');

                // 初始化（只執行一次）
                if (!initialized[pageId]) {
                    initialized[pageId] = true;
                    initPage(pageId);
                }

                // 更新瀏覽器網址 hash
                history.pushState({ page: pageId }, '', '#' + pageId);
            }

            // 瀏覽器返回鍵支援
            window.addEventListener('popstate', (e) => {
                const pageId = (e.state && e.state.page) ? e.state.page : 'cover';
                go(pageId);
            });

            return { go };
        })();

        // 根據 hash 決定初始頁面
        window.addEventListener('DOMContentLoaded', () => {
            const hash = location.hash.replace('#', '') || 'cover';
            if (hash !== 'cover') router.go(hash);
            // 封面預設：鎖定 overflow
            if (hash === 'cover') {
                document.body.style.overflow = 'hidden';
                document.getElementById('global-nav').style.display = 'none';
            }
        });
    </script>

    <!-- ===================================================

    <script>
        (function initCover() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let particlesArray = [];

            function setCanvasSize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', setCanvasSize);
            setCanvasSize();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedX = Math.random() * 1 - 0.5;
                    this.speedY = Math.random() * -1 - 0.2;
                    const colors = ['rgba(253,230,138,0.6)', 'rgba(167,243,208,0.4)', 'rgba(252,211,77,0.5)'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.y < 0 - this.size) {
                        this.y = canvas.height + this.size;
                        this.x = Math.random() * canvas.width;
                    }
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                }
            }

            for (let i = 0; i < 60; i++) particlesArray.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particlesArray.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();

            // --- 海洋滾動切換邏輯 ---
            const oceanOverlay  = document.getElementById('oceanOverlay');
            const coverEnterBtn = document.getElementById('cover-enter-btn');
            let scrollProgress  = 0;

            function updateOceanState() {
                scrollProgress = Math.max(0, Math.min(1, scrollProgress));
                oceanOverlay.style.opacity = scrollProgress;

                if (scrollProgress > 0.5) {
                    coverEnterBtn.style.borderColor   = 'rgba(34,211,238,0.5)';
                    coverEnterBtn.style.color         = '#cffafe';
                    coverEnterBtn.textContent         = '揚帆出海航行';
                } else {
                    coverEnterBtn.style.borderColor   = 'rgba(253,230,138,0.4)';
                    coverEnterBtn.style.color         = '#fef3c7';
                    coverEnterBtn.textContent         = '進入山林採集';
                }
            }

            window.addEventListener('wheel', (e) => {
                scrollProgress += e.deltaY * 0.0015;
                updateOceanState();
            });

            let startY = 0;
            window.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
            window.addEventListener('touchmove', e => {
                scrollProgress += (startY - e.touches[0].clientY) * 0.003;
                startY = e.touches[0].clientY;
                updateOceanState();
            }, { passive: true });
        })();
    </script>

    <!-- ===================================================
         各頁面動態載入（Lazy Load）系統
    ==================================================== -->
    <script>
        // 頁面 ID → 對應的原始 HTML 檔案名稱
        const PAGE_FILES = {
            rulebook:  '規則書.html',
            scenario:  '情境腳本.html',
            fieldwork: '走讀.html',
            classroom: '課堂.html',
        };

        // 執行從外部 HTML 注入的 <script> 標籤（innerHTML 不會自動執行）
        // 已在 index.html head 預載的函式庫 src 清單（跳過重複載入）
        const PRELOADED_SRCS = ['react', 'react-dom', 'babel', 'lucide'];

        async function runInjectedScripts(container) {
            const scripts = Array.from(container.querySelectorAll('script'));

            for (const oldScript of scripts) {
                const scriptType = oldScript.getAttribute('type') || '';
                const src = oldScript.getAttribute('src') || '';

                if (src) {
                    // 外部腳本：若已預載則直接移除，否則非同步載入並等待
                    const isPreloaded = PRELOADED_SRCS.some(lib => src.includes(lib));
                    if (isPreloaded) {
                        oldScript.remove();
                        continue;
                    }
                    await new Promise(resolve => {
                        const newScript = document.createElement('script');
                        newScript.src = src;
                        Array.from(oldScript.attributes).forEach(attr => {
                            if (attr.name !== 'src') newScript.setAttribute(attr.name, attr.value);
                        });
                        newScript.onload  = resolve;
                        newScript.onerror = resolve; // 出錯也繼續
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                } else if (scriptType === 'text/babel') {
                    // Babel/React 腳本：手動轉譯
                    try {
                        const transpiled = Babel.transform(oldScript.textContent, {
                            presets: ['react'],
                        }).code;
                        const newScript = document.createElement('script');
                        newScript.textContent = transpiled;
                        document.body.appendChild(newScript);
                        oldScript.remove();
                    } catch(e) {
                        console.error('❌ Babel 轉譯失敗：', e);
                    }

                } else {
                    // 一般 inline script
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                    oldScript.remove();
                }
            }
        }

        // 從原始 HTML 檔案中萃取 <head> 的 style 與 <body> 的內容
        function extractBody(htmlText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            // 萃取 <head> 中的所有 <style> 標籤，注入到 body 最前面
            let headStyles = '';
            doc.querySelectorAll('head style').forEach(s => {
                headStyles += `<style>${s.textContent}</style>`;
            });

            // 移除舊的全域導覽列（fixed top-0 z-[100] 樣式的 div）
            const oldNav = doc.querySelector('#global-nav');
            if (oldNav) oldNav.remove();
            // 用 class 特徵再清一次（情境腳本裡的舊導覽）
            doc.querySelectorAll('div').forEach(div => {
                const cls = div.className || '';
                if (cls.includes('fixed') && cls.includes('top-0') && cls.includes('z-[100]')) {
                    div.remove();
                }
            });

            const bodyHTML = doc.body ? doc.body.innerHTML : htmlText;
            return headStyles + bodyHTML;
        }

        async function initPage(pageId) {
            const section = document.getElementById('page-' + pageId);
            const filename = PAGE_FILES[pageId];
            if (!filename || !section) return;

            // 顯示載入動畫
            section.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                     height:100vh;background:#01120d;color:#34d399;font-family:'Noto Serif TC',serif;">
                    <div style="width:44px;height:44px;border:3px solid rgba(52,211,153,0.2);
                         border-top-color:#34d399;border-radius:50%;
                         animation:_spin 1s linear infinite;margin-bottom:20px;">
                    </div>
                    <style>@keyframes _spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
                    <p style="letter-spacing:0.25em;font-size:0.9rem;opacity:0.8;">${filename.replace('.html','')} 載入中...</p>
                </div>`;

            try {
                const res = await fetch('./' + encodeURIComponent(filename));
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const html = await res.text();

                // 注入 body 內容（去除舊導覽列）
                section.innerHTML = extractBody(html);

                // 補上該頁面需要的 padding-top 以避免被全域導覽列遮住
                section.style.paddingTop = '44px';

                // 執行頁面內的 script（非同步依序，Babel 轉譯完成後才繼續）
                await runInjectedScripts(section);

                // ★ 腳本執行後，再清除一次殘留的舊導覽列（JS 動態生成的無法預先過濾）
                // 延遲 300ms 確保情境腳本的 appContainer.innerHTML 已執行完畢
                setTimeout(() => {
                    section.querySelectorAll('div, nav').forEach(el => {
                        const cls = el.className || '';
                        const hasBg = cls.includes('bg-[#010a08]') || cls.includes('bg-\\[#010a08\\]');
                        const hasNav = el.querySelector('a[href*=".html"]');
                        if (hasBg && hasNav) el.remove();
                    });
                    // 也移除含有舊連結的 fixed nav div
                    section.querySelectorAll('[class*="border-emerald-900/50"][class*="justify-center"]').forEach(el => {
                        if (el.querySelector('a[href*="封面.html"], a[href*="規則書.html"]')) el.remove();
                    });
                    if (window.lucide) lucide.createIcons();
                }, 300);

                console.log(`✅ ${filename} 載入完成`);
            } catch (err) {
                section.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
                    height:60vh;color:#f87171;font-size:1rem;letter-spacing:0.2em;">
                    ⚠ 載入失敗：${err.message}<br><small style="opacity:0.6;margin-top:8px;display:block;">
                    請確認在本機伺服器環境下開啟（非直接用瀏覽器開啟檔案）</small></div>`;
                console.error(`❌ 載入 ${filename} 失敗：`, err);
            }
        }
    </script>

    <!-- ===================================================
         本機伺服器提示（直接開啟檔案時顯示）
    ==================================================== -->
    <script>
        // 偵測是否在 file:// 協議下開啟（此時 fetch 無法跨檔案）
        if (location.protocol === 'file:') {
            window.addEventListener('DOMContentLoaded', () => {
                const banner = document.createElement('div');
                banner.style.cssText = `position:fixed;bottom:0;left:0;right:0;z-index:9999;
                    background:#1c0a00;border-top:1px solid #92400e;
                    color:#fbbf24;font-size:0.8rem;padding:10px 20px;
                    text-align:center;letter-spacing:0.1em;font-family:monospace;`;
                banner.innerHTML = `⚠ 目前以 <b>file://</b> 方式開啟。動態載入功能需要本機伺服器。
                    建議使用 VS Code「Live Server」或執行 <code style="background:#451a03;padding:2px 6px;border-radius:3px;">
                    python -m http.server 8080</code> 後，前往 <b>http://localhost:8080</b> 開啟。
                    <button onclick="this.parentNode.remove()" style="margin-left:16px;cursor:pointer;
                    background:#78350f;border:none;color:#fde68a;padding:2px 10px;border-radius:4px;">✕</button>`;
                document.body.appendChild(banner);
            });
        }
    </script>

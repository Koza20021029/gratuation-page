<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaka：島嶼的維度</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 引入 Google Fonts: 思源宋體 (Noto Serif TC) 作為明體呈現 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        /* 全局設定使用明體 */
        body {
            font-family: 'Noto Serif TC', serif;
            margin: 0;
            overflow: hidden;
            background-color: #01120d;
            /* 博物館深墨綠基底 */
        }

        /* 背景動畫設定 */
        .bg-avaka-leaves {
            /* 使用熱帶蕉葉/馬尼拉麻意象的高畫質圖片 */
            background-image: url('https://images.unsplash.com/photo-1595859702816-0498db2579df?auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            /* 呼吸般的緩慢縮放動畫，增添神秘與生命力 */
            animation: breathe 20s infinite alternate ease-in-out;
            transform-origin: center;
        }

        @keyframes breathe {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.1);
            }
        }

        /* 文字發光效果 */
        .text-glow {
            text-shadow: 0px 0px 20px rgba(253, 230, 138, 0.4), 0px 4px 10px rgba(0, 0, 0, 0.8);
        }

        .subtitle-glow {
            text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* 漸層遮罩，讓文字更清晰 */
        .overlay-gradient {
            background: radial-gradient(circle at center, rgba(1, 18, 13, 0.5) 0%, rgba(1, 18, 13, 0.95) 100%);
        }

        /* 按鈕 hover 動畫 */
        .btn-enter {
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s ease;
        }

        .btn-enter:hover::before {
            left: 100%;
        }
    </style>
</head>

<body class="relative w-screen h-screen flex items-center justify-center select-none">

    <!-- 動態蕉葉背景 -->
    <div class="absolute inset-0 bg-avaka-leaves opacity-60 z-0"></div>

    <!-- 漸層暗色遮罩 (陸地森林色調) -->
    <div class="absolute inset-0 overlay-gradient z-10"></div>

    <!-- 海洋深藍漸層遮罩 (初始透明，隨滾輪往下滾動浮現) -->
    <div id="oceanOverlay" class="absolute inset-0 z-[15] pointer-events-none transition-opacity duration-300 ease-out" 
         style="opacity: 0; background: radial-gradient(circle at bottom, rgba(14, 116, 144, 0.75) 0%, rgba(8, 47, 73, 0.85) 45%, rgba(2, 6, 23, 0.98) 100%);">
    </div>

    <!-- 粒子特效畫布 -->
    <canvas id="particleCanvas" class="absolute inset-0 z-20 pointer-events-none"></canvas>

    <!-- 內容區域 -->
    <div class="relative z-30 flex flex-col items-center justify-center text-center px-4 w-full max-w-5xl">

        <!-- 副標題 / 引言 -->
        <p
            class="text-amber-100/70 text-lg md:text-xl tracking-[0.3em] font-light mb-6 subtitle-glow opacity-0 animate-[fadeIn_2s_ease-out_0.5s_forwards]">
            順應夜曆，還是追求效率？
        </p>

        <!-- 主標題 -->
        <h1
            class="text-5xl md:text-7xl lg:text-8xl font-black text-amber-50 tracking-widest text-glow mb-4 opacity-0 animate-[fadeInUp_2s_ease-out_1s_forwards]">
            Avaka
        </h1>
        <h2
            class="text-4xl md:text-5xl lg:text-6xl font-bold text-amber-100/90 tracking-[0.2em] text-glow mb-12 opacity-0 animate-[fadeInUp_2s_ease-out_1.5s_forwards]">
            島嶼的維度
        </h2>

        <!-- 遊戲核心理念 -->
        <div class="h-px w-24 bg-amber-200/30 mb-8 opacity-0 animate-[fadeIn_2s_ease-out_2s_forwards]"></div>
        <p
            class="text-emerald-50/80 text-base md:text-lg tracking-[0.15em] font-light max-w-2xl leading-relaxed subtitle-glow opacity-0 animate-[fadeIn_2s_ease-out_2.5s_forwards]">
            身為蘭嶼的工匠，你必須在 12 個月內完成一艘拼板舟。<br>
            在「傳統馬尼拉蕉麻」與「現代化學樹脂」之間，<br>
            決定你要留下什麼樣的文化認同。
        </p>

        <!-- 進入按鈕 (連結至本地規則書頁面) -->
        <a href="./規則書.html" id="enter-btn"
            class="inline-block mt-16 px-10 py-4 border border-amber-200/40 text-amber-100 text-lg tracking-[0.2em] font-medium rounded-sm btn-enter hover:bg-amber-900/40 hover:border-amber-200 hover:text-white hover:shadow-[0_0_15px_rgba(253,230,138,0.3)] opacity-0 animate-[fadeIn_2s_ease-out_3s_forwards] no-underline cursor-pointer transition-colors duration-500">
            進入山林採集
        </a>

    </div>

    <!-- 簡單的動畫 Keyframes -->
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <!-- 粒子特效腳本 (模擬林間的孢子、靈力或螢火蟲) -->
    <script>
        const canvas = document.getElementById('particleCanvas');
        let scrollProgress = 0;
        try {
            const glCtx = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false }) ||
                           canvas.getContext('experimental-webgl', { alpha: true });
            if (glCtx) {
                const gl = glCtx;
                gl.clearColor(0, 0, 0, 0);
                gl.enable(gl.BLEND);
                gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

                const hexToRgb = hex => {
                    hex = hex.replace(/^#/, '');
                    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                    const int = parseInt(hex, 16);
                    return [((int >> 16) & 255) / 255, ((int >> 8) & 255) / 255, (int & 255) / 255];
                };

                const colorsLand  = ['#fde68a', '#a7f3d0', '#fcd34d'];
                const colorsOcean = ['#22d3ee', '#38bdf8', '#cffafe'];

                const compileShader = (src, type) => {
                    const s = gl.createShader(type);
                    gl.shaderSource(s, src);
                    gl.compileShader(s);
                    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                        console.error('Shader error:', gl.getShaderInfoLog(s));
                        return null;
                    }
                    return s;
                };

                const vsrc = `
                    attribute vec3 aPos;
                    attribute vec4 aRnd;
                    attribute vec3 aColorLand;
                    attribute vec3 aColorOcean;
                    uniform float uTime;
                    uniform float uOceanProg;
                    uniform float uOffX;
                    uniform float uOffY;
                    uniform float uRotX;
                    uniform float uRotY;
                    uniform float uRotZ;
                    uniform float uAspect;
                    varying vec4 vRnd;
                    varying vec3 vColor;

                    vec3 rotateX(vec3 p, float a) {
                        float c = cos(a), s = sin(a);
                        return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z);
                    }
                    vec3 rotateY(vec3 p, float a) {
                        float c = cos(a), s = sin(a);
                        return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z);
                    }
                    vec3 rotateZ(vec3 p, float a) {
                        float c = cos(a), s = sin(a);
                        return vec3(c*p.x - s*p.y, s*p.x + c*p.y, p.z);
                    }

                    void main() {
                        vRnd = aRnd;
                        vColor = mix(aColorLand, aColorOcean, uOceanProg);

                        vec3 pos = aPos * 3.0;
                        pos.x += sin(uTime * aRnd.z + 6.28 * aRnd.w) * mix(0.05, 0.4, aRnd.x);
                        pos.y += sin(uTime * aRnd.y + 6.28 * aRnd.x) * mix(0.05, 0.4, aRnd.w);
                        pos.z += sin(uTime * aRnd.w + 6.28 * aRnd.y) * mix(0.05, 0.4, aRnd.z);

                        pos = rotateX(pos, uRotX);
                        pos = rotateY(pos, uRotY);
                        pos = rotateZ(pos, uRotZ);

                        pos.x += uOffX;
                        pos.y += uOffY;

                        float fov = 0.26;
                        float z = pos.z + 5.0;
                        vec2 proj = pos.xy * fov / z;
                        proj.x /= uAspect;

                        float sz = (80.0 * (1.0 + 0.6 * (aRnd.x - 0.5))) / z;
                        gl_PointSize = clamp(sz, 1.0, 30.0);
                        gl_Position = vec4(proj, 0.0, 1.0);
                    }
                `;

                const fsrc = `
                    precision mediump float;
                    uniform float uTime;
                    varying vec4 vRnd;
                    varying vec3 vColor;
                    void main() {
                        vec2 uv = gl_PointCoord - vec2(0.5);
                        float d = length(uv);
                        float alpha = smoothstep(0.5, 0.3, d) * 0.9;
                        vec3 col = vColor + 0.15 * sin(uv.yyx + uTime + vRnd.y * 6.28);
                        gl_FragColor = vec4(col, alpha);
                    }
                `;

                const vs = compileShader(vsrc, gl.VERTEX_SHADER);
                const fs = compileShader(fsrc, gl.FRAGMENT_SHADER);
                if (!vs || !fs) throw new Error('Shader compile failed');

                const prog = gl.createProgram();
                gl.attachShader(prog, vs);
                gl.attachShader(prog, fs);
                gl.linkProgram(prog);
                if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('Program link failed');
                gl.useProgram(prog);

                const COUNT = 300;
                const posData  = new Float32Array(COUNT * 3);
                const rndData  = new Float32Array(COUNT * 4);
                const landData = new Float32Array(COUNT * 3);
                const oceanData= new Float32Array(COUNT * 3);

                for (let i = 0; i < COUNT; i++) {
                    let x, y, z, len;
                    do {
                        x = Math.random() * 2 - 1;
                        y = Math.random() * 2 - 1;
                        z = Math.random() * 2 - 1;
                        len = x*x + y*y + z*z;
                    } while (len > 1 || len === 0);
                    const r = Math.cbrt(Math.random());
                    posData.set([x*r, y*r, z*r], i*3);
                    rndData.set([Math.random(), Math.random(), Math.random(), Math.random()], i*4);
                    landData.set(hexToRgb(colorsLand[Math.floor(Math.random()*colorsLand.length)]), i*3);
                    oceanData.set(hexToRgb(colorsOcean[Math.floor(Math.random()*colorsOcean.length)]), i*3);
                }

                const mkBuf = data => {
                    const b = gl.createBuffer();
                    gl.bindBuffer(gl.ARRAY_BUFFER, b);
                    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
                    return b;
                };

                const posBuf   = mkBuf(posData);
                const rndBuf   = mkBuf(rndData);
                const landBuf  = mkBuf(landData);
                const oceanBuf = mkBuf(oceanData);

                const bindAttr = (buf, name, size) => {
                    const loc = gl.getAttribLocation(prog, name);
                    if (loc < 0) return;
                    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                    gl.enableVertexAttribArray(loc);
                    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
                };
                bindAttr(posBuf,   'aPos',       3);
                bindAttr(rndBuf,   'aRnd',       4);
                bindAttr(landBuf,  'aColorLand', 3);
                bindAttr(oceanBuf, 'aColorOcean',3);

                const uTime      = gl.getUniformLocation(prog, 'uTime');
                const uOceanProg = gl.getUniformLocation(prog, 'uOceanProg');
                const uOffX      = gl.getUniformLocation(prog, 'uOffX');
                const uOffY      = gl.getUniformLocation(prog, 'uOffY');
                const uRotX      = gl.getUniformLocation(prog, 'uRotX');
                const uRotY      = gl.getUniformLocation(prog, 'uRotY');
                const uRotZ      = gl.getUniformLocation(prog, 'uRotZ');
                const uAspect    = gl.getUniformLocation(prog, 'uAspect');

                const resizeCanvas = () => {
                    const dpr = window.devicePixelRatio || 1;
                    canvas.width  = window.innerWidth  * dpr;
                    canvas.height = window.innerHeight * dpr;
                    canvas.style.width  = window.innerWidth  + 'px';
                    canvas.style.height = window.innerHeight + 'px';
                    gl.viewport(0, 0, canvas.width, canvas.height);
                };
                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                let targetOffX = 0, targetOffY = 0;
                let currOffX   = 0, currOffY   = 0;
                window.addEventListener('mousemove', e => {
                    targetOffX = -((e.clientX / window.innerWidth)  * 2 - 1) * 0.4;
                    targetOffY =  ((e.clientY / window.innerHeight) * 2 - 1) * 0.4;
                });

                let startTime = performance.now();
                let rotZ = 0;

                const render = now => {
                    requestAnimationFrame(render);
                    const t = (now - startTime) * 0.001;
                    currOffX += (targetOffX - currOffX) * 0.04;
                    currOffY += (targetOffY - currOffY) * 0.04;
                    rotZ += 0.0006;

                    gl.clear(gl.COLOR_BUFFER_BIT);
                    gl.uniform1f(uTime,      t);
                    gl.uniform1f(uOceanProg, scrollProgress);
                    gl.uniform1f(uOffX,      currOffX);
                    gl.uniform1f(uOffY,      currOffY);
                    gl.uniform1f(uRotX,      Math.sin(t * 0.05) * 0.15);
                    gl.uniform1f(uRotY,      Math.cos(t * 0.07) * 0.18);
                    gl.uniform1f(uRotZ,      rotZ);
                    gl.uniform1f(uAspect,    canvas.width / canvas.height);
                    gl.drawArrays(gl.POINTS, 0, COUNT);
                };
                requestAnimationFrame(render);
            } else {
                console.warn('WebGL not supported. Falling back to static background.');
            }
        } catch (e) {
            console.error('Failed to initialize WebGL particles:', e);
        }

        // --- 滾動切換海洋動畫邏輯 ---
        const oceanOverlay = document.getElementById('oceanOverlay');
        const enterBtn = document.getElementById('enter-btn');

        function updateOceanState() {
            // 限制進度在 0 到 1 之間
            if (scrollProgress > 1) scrollProgress = 1;
            if (scrollProgress < 0) scrollProgress = 0;
            
            // 更新海洋遮罩透明度
            oceanOverlay.style.opacity = scrollProgress;
            
            // 當滾動超過一半時，切換按鈕視覺為「海洋主題」
            if (scrollProgress > 0.5) {
                enterBtn.classList.add('border-cyan-400/50', 'text-cyan-100', 'hover:shadow-[0_0_15px_rgba(34,211,238,0.4)]', 'hover:bg-cyan-900/40');
                enterBtn.classList.remove('border-amber-200/40', 'text-amber-100', 'hover:shadow-[0_0_15px_rgba(253,230,138,0.3)]', 'hover:bg-amber-900/40');
                if(enterBtn.innerHTML.indexOf("揚帆出海航行") === -1) {
                    enterBtn.innerHTML = "揚帆出海航行";
                }
            } else {
                enterBtn.classList.add('border-amber-200/40', 'text-amber-100', 'hover:shadow-[0_0_15px_rgba(253,230,138,0.3)]', 'hover:bg-amber-900/40');
                enterBtn.classList.remove('border-cyan-400/50', 'text-cyan-100', 'hover:shadow-[0_0_15px_rgba(34,211,238,0.4)]', 'hover:bg-cyan-900/40');
                if(enterBtn.innerHTML.indexOf("進入山林採集") === -1) {
                    enterBtn.innerHTML = "進入山林採集";
                }
            }
        }

        // 電腦版滾輪事件
        window.addEventListener('wheel', (e) => {
            scrollProgress += e.deltaY * 0.0015; // 調整靈敏度
            updateOceanState();
        });

        // 手機版滑動事件
        let startY = 0;
        window.addEventListener('touchstart', e => {
            startY = e.touches[0].clientY;
        }, { passive: true });
        
        window.addEventListener('touchmove', e => {
            let deltaY = startY - e.touches[0].clientY;
            scrollProgress += deltaY * 0.003;
            startY = e.touches[0].clientY;
            updateOceanState();
        }, { passive: true });

    </script>
</body>

</html>
